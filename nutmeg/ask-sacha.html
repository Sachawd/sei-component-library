<style>
  :root {
    --paper: #f6f5f1;

  .wrap {

  textarea:focus, input:focus, button:focus-visible {

  .btn-row {

  button {

    font-size: 17px;
    font-weight: 700;

  .btn-primary {
    background: var(--ink);

  }

  .route-box {
    display: none;

  .route-box.open {
    display: flex;
    gap: 10px;

  .route-box input {

  .source-link {
    display: inline-block;
    margin-top: 22px;
    font-size: 14px;

    text-decoration: underline;
  }
  .toast {
    display: none;
    background: var(--ink);
    color: #fff;
    padding: 14px 20px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 20px;
  }
  .toast.show {
    display: block;
  }
  .empty-state {
    text-align: center;
    padding: 48px 24px;
  }
  .empty-state h2 {
    font-size: 28px;
    margin: 0 0 12px 0;
  }
  .footer-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    font-size: 15px;
    color: var(--muted);
  }
  .link-btn {
    background: none;
    border: none;
    padding: 0;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    text-decoration: underline;
    cursor: pointer;
  }
</style>
</head>
<body>

xisting tokens native Figma variables, or only in Tokens Studio? Asked 14 and 15 Oct.", "why": "Settles a visual or design rule so Design System does not guess.", "files": ["2026-10-26__design-system-to-sacha-and-fable__roadmap-meeting-prep--vue-3-v2-tokens-neil-aligned--full-detail.md"], "score": 10}, {"id": "1a8909278a14", "agent": "Design System", "date": "2026-10-26", "question": "Draft the SEI colour-check skill for the Figma agent? First asked 28 Sept.", "why": "Settles a visual or design rule so Design System does not guess.", "files": ["2026-10-26__design-system-to-sacha-and-fable__roadmap-meeting-prep--vue-3-v2-tokens-neil-aligned--full-detail.md"], "score": 10}, {"id": "39616064e407", "agent": "Campaigns", "date": "2026-10-26", "question": "Does WorldSoccerShop run its own Free Name and Number? Until you say yes, keep it out of WorldSoccerShop material.", "why": "Unblocks Campaigns so they do not have to guess.", "files": ["2026-10-26__campaigns-to-argon__soccer-com-promo-schedule-and-holiday-hub-corrections.md"], "score": 10}];
const STORAGE_KEY = "ask_sacha_local_queue_v1";

function getQueue() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  } catch (e) {
    return [];
  }
}

function saveQueue(q) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(q));
}

const queuedIds = new Set(getQueue().map(i => i.id));
let deck = INITIAL_CARDS.filter(c => !queuedIds.has(c.id));
let currentIndex = 0;

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 3500);
}

async function persistItem(item) {
  const q = getQueue();
  q.push(item);
  saveQueue(q);

  // Try writing directly to the local Mac helper if running on localhost
  try {
    const res = await fetch("http://127.0.0.1:8765/api/answer", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(item)
    });
    if (res.ok) {
      return "written";
    }
  } catch (e) {
    // Local helper not running; kept safely in localStorage and ready for 1-click file save or Argon sync
  }
  return "queued";
}

function render() {
  const stage = document.getElementById("stage");
  const pill = document.getElementById("counter-pill");
  const remaining = deck.length - currentIndex;

  if (remaining <= 0) {
    pill.textContent = "0 waiting";
    stage.innerHTML = `
      <div class="card empty-state">
        <h2>All caught up!</h2>
        <p>Zero open questions waiting on you right now.</p>
      </div>
    `;
    return;
  }

  pill.textContent = `Question 1 of ${remaining} waiting`;
  const card = deck[currentIndex];
  const fileHref = card.files && card.files.length ? card.files[0] : "#";

  stage.innerHTML = `
    <article class="card">
      <div class="card-header">
        <span class="agent-tag">${card.agent}</span>
        <span class="date-tag">Asked ${card.date}</span>
      </div>
      <h2 class="question-text">${card.question}</h2>
      <div class="why-box">
        <span class="why-label">Why it matters</span>
        ${card.why}
      </div>
      <label class="field-label" for="answer-input">Your answer</label>
      <textarea id="answer-input" placeholder="Type or dictate your answer in plain words..."></textarea>
      <div class="btn-row">
        <button type="button" class="btn-primary" id="btn-answer">Save answer</button>
        <button type="button" class="btn-secondary" id="btn-park">Not now (park for tomorrow)</button>
        <button type="button" class="btn-secondary" id="btn-route-toggle">Not mine (route to someone)</button>
      </div>
      <div class="route-box" id="route-box">
        <input type="text" id="route-input" placeholder="Type who owns this (for example: Fable, Tyler, Colby, Components)...">
        <button type="button" class="btn-primary" id="btn-route-confirm">Route it</button>
      </div>
      <a class="source-link" href="${fileHref}" target="_blank" rel="noopener">Open source note (${card.files.length} file${card.files.length > 1 ? "s" : ""})</a>
    </article>
  `;

  document.getElementById("btn-answer").addEventListener("click", async () => {
    const val = document.getElementById("answer-input").value.trim();
    if (!val) {
      document.getElementById("answer-input").focus();
      return;
    }
    const status = await persistItem({
      id: card.id,
      action: "answer",
      answer: val,
      files: card.files,
      agent: card.agent,
      question: card.question
    });
    currentIndex++;
    showToast(status === "written"
      ? "Saved directly into the agent's handoff file and Running List!"
      : "Answer saved! Next card ready.");
    render();
  });

  document.getElementById("btn-park").addEventListener("click", async () => {
    await persistItem({
      id: card.id,
      action: "park",
      files: card.files,
      agent: card.agent,
      question: card.question
    });
    currentIndex++;
    showToast("Parked until tomorrow.");
    render();
  });

  document.getElementById("btn-route-toggle").addEventListener("click", () => {
    const rb = document.getElementById("route-box");
    rb.classList.toggle("open");
    if (rb.classList.contains("open")) {
      document.getElementById("route-input").focus();
    }
  });

  document.getElementById("btn-route-confirm").addEventListener("click", async () => {
    const who = document.getElementById("route-input").value.trim();
    if (!who) {
      document.getElementById("route-input").focus();
      return;
    }
    await persistItem({
      id: card.id,
      action: "route",
      routed_to: who,
      files: card.files,
      agent: card.agent,
      question: card.question
    });
    currentIndex++;
    showToast(`Routed to ${who}.`);
    render();
  });
}

document.getElementById("export-btn").addEventListener("click", () => {
  const q = getQueue();
  if (!q.length) {
    showToast("No queued answers to export.");
    return;
  }
  const blob = new Blob([JSON.stringify({ items: q }, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "ask-sacha-answers.json";
  a.click();
  showToast("Saved ask-sacha-answers.json to Downloads for Argon's harness.");
});

render();
</script>
