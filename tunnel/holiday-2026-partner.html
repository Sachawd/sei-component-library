<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Soccer.com Holiday 2026 · The Tunnel Partner View</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Adamina&family=Inter:wght@400;600&display=swap">
<link rel="stylesheet" href="../nutmeg/nutmeg.css">
<link rel="stylesheet" href="tunnel.css">
<style>
  .tp-shell { max-width: 1680px; margin: 0 auto; padding: 32px 32px 96px; }
  .tp-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 72px; padding: 0 32px; background: var(--nm-black); color: #FFFFFF; position: sticky; top: 0; z-index: 40; }
  .tp-header__brand { display: flex; align-items: center; gap: 14px; text-decoration: none; color: #FFFFFF; font: 600 15px/20px var(--nm-sans); }
  .tp-header__badge { padding: 4px 12px; border-radius: 999px; background: rgba(88, 172, 242, 0.2); color: #8CC8FA; font: 600 12px/16px var(--nm-sans); }
  .tp-card__skus { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; padding: 10px 12px; border-radius: 8px; background: #F5F8FC; border: 1px solid #DCE6F2; }
  .tp-card__skus-label { width: 100%; font: 600 10px/13px var(--nm-sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--nm-muted); margin-bottom: 2px; }
  .tp-sku { padding: 3px 8px; border-radius: 5px; background: #FFFFFF; border: 1px solid #C8D7EA; color: var(--tn-blue); font: 600 12px/16px var(--nm-mono); cursor: pointer; transition: background-color .15s ease, color .15s ease; }
  .tp-sku:hover { background: var(--tn-blue); color: #FFFFFF; border-color: var(--tn-blue); }
  .tp-card__desc { margin: 0; color: var(--nm-text); font: 400 13px/18px var(--nm-sans); }
  .tp-card__file { margin: 0; color: var(--nm-muted); font: 400 11px/15px var(--nm-mono); word-break: break-all; }
  @media (max-width: 768px) {
    .tp-shell { padding: 16px 16px 64px; }
    .tp-header { padding: 0 16px; }
  }
</style>
</head>
<body data-hub="tunnel">
<a class="nm-skip" href="#tp-main">Skip to content</a>

<header class="tp-header">
  <div class="tp-header__brand">
    <svg width="34" height="34" viewBox="0 0 39 39" fill="none" aria-hidden="true"><path d="M5.81943 12.7935C6.21922 12.5185 6.66399 12.3861 7.17872 12.3861H38.5322V7.40527H7.18371C5.42964 7.40527 3.87546 7.94512 2.57114 9.00443C1.1269 10.186 0.362305 11.7546 0.362305 13.532V16.2312C0.362305 18.0137 1.1269 19.5772 2.56614 20.7537C3.87046 21.8334 5.42464 22.3783 7.18371 22.3783H14.1201C14.6498 22.3783 15.1045 22.5158 15.5043 22.7857C15.9041 23.0709 15.9641 23.3052 15.9641 23.5242V26.2438C15.9641 26.4577 15.9091 26.6971 15.5143 26.9772C15.1095 27.2573 14.6548 27.3948 14.1251 27.3948H0.362305V32.3756H14.1201C15.8292 32.3756 17.3584 31.8561 18.6777 30.8274C20.1719 29.6458 20.9615 28.062 20.9615 26.2489V23.5293C20.9615 21.7519 20.1969 20.1833 18.7426 18.9966C17.4283 17.9373 15.8741 17.4026 14.1201 17.4026H7.18371C6.66899 17.4026 6.22922 17.2651 5.83442 16.985C5.36467 16.6437 5.36467 16.3789 5.36467 16.2363V13.5371C5.36467 13.3283 5.41964 13.094 5.82443 12.7986" fill="#EF433F"/><path d="M24.4502 22.3773H38.5377V17.3965H22.2363C23.4657 18.8225 24.2253 20.5286 24.4452 22.3773" fill="#5B7DBC"/><path d="M22.2363 32.3705H38.5328V27.3896H24.4502C24.2303 29.2435 23.4657 30.9496 22.2363 32.3705Z" fill="#28387A"/></svg>
    <span>The Tunnel · Soccer.com Holiday 2026</span>
  </div>
  <span class="tp-header__badge">235 Studio Photos · 15 Spin Videos · Verified SKUs</span>
</header>

<main class="tp-shell" id="tp-main">
  <section class="tn-brand" aria-labelledby="tp-title">
    <div class="tn-brand__hero">
      <h1 class="tn-brand__mark" id="tp-title">
        <img src="../nutmeg/logos/Logos_sdc.png" width="177" height="44" alt="Soccer.com">
      </h1>
      <div class="tn-brand__search-stack">
        <form class="tn-search" id="tp-search-form" role="search">
          <label class="nm-visually-hidden" for="tp-search">Search Holiday 2026 assets by SKU, shot, team, brand, or paper color</label>
          <input class="tn-search__input" id="tp-search" type="search" placeholder="Search by SKU (e.g. A1142150, RV7030736), Shot, Team, Brand, or Paper..." autocomplete="off">
        </form>
        <div class="tn-brand__icon-bar" id="tp-icons" role="group" aria-label="Asset type filter"></div>
      </div>
    </div>

    <div class="tn-brand__body" style="border-radius: 0 0 24px 24px;">
      <div class="tn-toolbar">
        <div>
          <h2 class="tn-section-h" id="tp-heading">All Holiday 2026 Studio &amp; 360 Assets</h2>
          <p class="tn-meta-count" id="tp-count">Loading 250 verified assets with SKU mappings...</p>
        </div>
        <div class="tn-chips" id="tp-chips"></div>
      </div>
      <div class="tn-grid" id="tp-grid" aria-live="polite"></div>
    </div>
  </section>
</main>

<dialog class="tn-dialog" id="tn-shoot-dialog" aria-labelledby="tn-sd-title">
  <div class="tn-dialog__head">
    <div>
      <h2 class="tn-dialog__title" id="tn-sd-title">Shoot files</h2>
      <p class="tn-dialog__sub" id="tn-sd-sub"></p>
    </div>
    <button type="button" class="tn-btn tn-btn--outline" id="tn-sd-close">Close</button>
  </div>
  <div class="tn-dialog__body" id="tn-sd-body"></div>
</dialog>

<script>
(function () {
  var S3_BASE = "https://www.imagehandler.net/dxassets/?img=Photos/";
  var $ = function (id) { return document.getElementById(id); };
  var grid = $("tp-grid"), heading = $("tp-heading"), countEl = $("tp-count");
  var iconsEl = $("tp-icons"), chipsEl = $("tp-chips"), searchInput = $("tp-search");

  var state = { mode: "all", chip: "", q: "" };
  var MANIFEST = [];
  var VENDOR = null;

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function num(n) { return Number(n || 0).toLocaleString("en-US"); }
  function enc(f) {
    return String(f || "").replace(/\+/g, "%2B").replace(/#/g, "%23").replace(/&/g, "%26").replace(/ /g, "%20");
  }

  var ICONS = {
    all: '<svg viewBox="0 0 24 24" stroke-width="1.75"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
    photo: '<svg viewBox="0 0 24 24" stroke-width="1.75"><path d="M4 7h3l2-2h6l2 2h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z"/><circle cx="12" cy="13" r="3.5"/></svg>',
    spin: '<svg viewBox="0 0 24 24" stroke-width="1.75"><rect x="2.5" y="5" width="14" height="14" rx="2"/><path d="M16.5 10l5-3v10l-5-3v-4Z"/></svg>',
    model: '<svg viewBox="0 0 24 24" stroke-width="1.75"><circle cx="12" cy="8" r="4"/><path d="M5 20c0-3.8 3.1-6.5 7-6.5s7 2.7 7 6.5"/></svg>',
    product: '<svg viewBox="0 0 24 24" stroke-width="1.75"><path d="M12 3L3 7.5v9L12 21l9-4.5v-9L12 3Z"/><path d="M3 7.5L12 12l9-4.5M12 12v9"/></svg>',
    vendor: '<svg viewBox="0 0 24 24" stroke-width="1.75"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c2.5 2.6 4 5.9 4 9.5s-1.5 6.9-4 9.5c-2.5-2.6-4-5.9-4-9.5s1.5-6.9 4-9.5Z"/></svg>'
  };

  function buildControls() {
    var photosCount = MANIFEST.filter(function (r) { return r.type !== "OrbitView 360 Still"; }).length;
    var spinsCount = MANIFEST.filter(function (r) { return r.type === "OrbitView 360 Still"; }).length;
    var modelCount = MANIFEST.filter(function (r) { return r.type === "On model"; }).length;
    var prodCount = MANIFEST.filter(function (r) { return r.type === "Product"; }).length;
    var vendorRows = (VENDOR && VENDOR.rows ? VENDOR.rows : []).filter(function (r) { return !r.boxUrl && r.home !== "Box"; });

    var iconDefs = [
      { id: "all", icon: ICONS.all, label: "All Holiday Assets", count: MANIFEST.length },
      { id: "photos", icon: ICONS.photo, label: "Studio Photos", count: photosCount },
      { id: "spins", icon: ICONS.spin, label: "360 Spin Videos", count: spinsCount },
      { id: "model", icon: ICONS.model, label: "On-Model", count: modelCount },
      { id: "product", icon: ICONS.product, label: "Product Shots", count: prodCount },
      { id: "vendor", icon: ICONS.vendor, label: "Shared Vendor Assets", count: vendorRows.length }
    ];

    iconsEl.innerHTML = iconDefs.map(function (d) {
      var on = state.mode === d.id;
      return '<button type="button" class="tn-icon-btn" data-mode="' + esc(d.id) + '" aria-pressed="' + (on ? "true" : "false") + '">' +
        d.icon + '<span>' + esc(d.label) + '</span><span class="tn-icon-btn__count">' + num(d.count) + "</span></button>";
    }).join("");

    var chipDefs = [
      { label: "All Filters", val: "" },
      { label: "Green Paper", val: "paper:Green" },
      { label: "Blue Paper", val: "paper:Blue" },
      { label: "Yellow Paper", val: "paper:Yellow" },
      { label: "Jerseys", val: "cat:Jerseys" },
      { label: "Footwear", val: "cat:Footwear" },
      { label: "Apparel", val: "cat:Apparel" },
      { label: "Balls & Equipment", val: "cat:Equipment" }
    ];

    chipsEl.innerHTML = state.mode === "vendor" ? "" : chipDefs.map(function (c) {
      var on = state.chip === c.val;
      return '<button type="button" class="tn-chip" data-chip="' + esc(c.val) + '" aria-pressed="' + (on ? "true" : "false") + '">' + esc(c.label) + "</button>";
    }).join("");
  }

  function renderHolidayCard(r) {
    var imgUrl = S3_BASE + enc(r.tunnel_s3_filename);
    var skus = (r.skus || "").split("|").filter(Boolean);
    var brands = (r.brands || "").split("|").filter(Boolean);
    var teams = (r.teams || "").split("|").filter(Boolean);
    var isSpin = r.type === "OrbitView 360 Still";

    var pills = [];
    pills.push('<span class="tn-pill tn-pill--offer">' + esc(r.shot) + "</span>");
    if (r.paper) pills.push('<span class="tn-pill">' + esc(r.paper) + "</span>");
    if (r.category) pills.push('<span class="tn-pill">' + esc(r.category) + "</span>");
    teams.forEach(function (t) { pills.push('<span class="tn-pill">' + esc(t) + "</span>"); });
    brands.forEach(function (b) { pills.push('<span class="tn-pill">' + esc(b) + "</span>"); });

    var skuBadges = skus.map(function (s) {
      return '<button type="button" class="tp-sku" data-copy-url="' + esc(s) + '" title="Click to copy SKU ' + esc(s) + '">' + esc(s) + "</button>";
    }).join("");

    var actions = [];
    if (isSpin && r.vimeo_url) {
      actions.push('<a class="tn-btn" href="' + esc(r.vimeo_url) + '" target="_blank" rel="noopener">Watch 360 Spin (Vimeo) &#8599;</a>');
    } else {
      actions.push('<a class="tn-btn" href="' + esc(imgUrl) + '" target="_blank" rel="noopener">Open Full-Res JPG &#8599;</a>');
    }
    actions.push('<button type="button" class="tn-btn tn-btn--outline" data-copy-url="' + esc(skus.join(", ")) + '">Copy SKUs (' + skus.length + ')</button>');
    actions.push('<button type="button" class="tn-btn tn-btn--outline" data-copy-url="' + esc(imgUrl) + '">Copy Image URL</button>');

    return '<article class="tn-card">' +
      '<a class="tn-card__media" href="' + esc(isSpin && r.vimeo_url ? r.vimeo_url : imgUrl) + '" target="_blank" rel="noopener">' +
        '<img src="' + esc(imgUrl) + '" alt="' + esc(r.description) + '" loading="lazy">' +
        '<span class="tn-card__store">' + esc(isSpin ? "360 Spin + Still" : r.original_file.replace(/\.jpg$/i, "")) + "</span>" +
      "</a>" +
      '<div class="tn-card__body">' +
        '<p class="tn-card__meta"><span>' + esc(r.type) + '</span><span>' + esc(r.size_kb + " KB") + "</span></p>" +
        '<div class="tn-card__pills">' + pills.join("") + "</div>" +
        '<h3 class="tn-card__title">' + esc(r.shot + " · " + r.group_title) + "</h3>" +
        '<p class="tp-card__desc">' + esc(r.description) + "</p>" +
        '<p class="tp-card__file">' + esc(r.tunnel_s3_filename) + "</p>" +
        '<div class="tp-card__skus"><span class="tp-card__skus-label">Article Numbers / SKUs (Click to copy)</span>' + skuBadges + "</div>" +
        '<div class="tn-card__actions">' + actions.join("") + "</div>" +
      "</div>" +
    "</article>";
  }

  function renderVendorCard(r, s3) {
    var base = s3 || S3_BASE;
    var cover = r.f ? (/^https?:\/\//.test(r.f) ? r.f : base + enc(r.f)) : "";
    var pills = [];
    (r.brands || []).forEach(function (b) { pills.push('<span class="tn-pill tn-pill--offer">' + esc(b) + "</span>"); });
    (r.cats || []).forEach(function (c) { pills.push('<span class="tn-pill">' + esc(c) + "</span>"); });
    (r.teams || []).forEach(function (t) { pills.push('<span class="tn-pill">' + esc(t) + "</span>"); });

    return '<article class="tn-card">' +
      '<div class="tn-card__media" data-shoot-open="' + esc(r.sl) + '">' +
        (cover ? '<img src="' + esc(cover) + '" alt="" loading="lazy">' : '') +
        '<span class="tn-card__store">Vendor Shoot</span>' +
      "</div>" +
      '<div class="tn-card__body">' +
        '<p class="tn-card__meta"><span>' + esc(r.d || "2026") + '</span><span>' + num(r.c) + " assets</span></p>" +
        '<div class="tn-card__pills">' + pills.join("") + "</div>" +
        '<h3 class="tn-card__title"><button type="button" data-shoot-open="' + esc(r.sl) + '">' + esc(r.n) + "</button></h3>" +
        '<div class="tn-card__actions">' +
          '<button type="button" class="tn-btn" data-shoot-open="' + esc(r.sl) + '">Inspect ' + num(r.c) + ' Files &amp; SKUs</button>' +
          (cover ? '<button type="button" class="tn-btn tn-btn--outline" data-copy-url="' + esc(cover) + '">Copy Cover URL</button>' : "") +
        "</div>" +
      "</div>" +
    "</article>";
  }

  function render() {
    buildControls();
    var words = (state.q || "").trim().toLowerCase().split(/\s+/).filter(Boolean);

    if (state.mode === "vendor") {
      var vRows = ((VENDOR && VENDOR.rows) || []).filter(function (r) {
        if (r.boxUrl || r.home === "Box") return false;
        if (!words.length) return true;
        var hay = ((r.n || "") + " " + (r.q || "") + " " + (r.brands || []).join(" ") + " " + (r.teams || []).join(" ")).toLowerCase();
        return words.every(function (w) { return hay.indexOf(w) >= 0; });
      });
      heading.textContent = "Shared Vendor Launches (adidas, Nike, PUMA)";
      countEl.textContent = "Showing " + num(vRows.length) + " shared vendor shoots.";
      grid.innerHTML = vRows.map(function (r) { return renderVendorCard(r, VENDOR.s3); }).join("") || '<p class="tn-empty">No matching vendor shoots found.</p>';
      return;
    }

    var filtered = MANIFEST.filter(function (r) {
      if (state.mode === "photos" && r.type === "OrbitView 360 Still") return false;
      if (state.mode === "spins" && r.type !== "OrbitView 360 Still") return false;
      if (state.mode === "model" && r.type !== "On model") return false;
      if (state.mode === "product" && r.type !== "Product") return false;

      if (state.chip) {
        var parts = state.chip.split(":");
        if (parts[0] === "paper" && r.paper !== parts[1]) return false;
        if (parts[0] === "cat") {
          if (parts[1] === "Equipment") {
            if (["Equipment", "Balls", "Goalkeeper", "Other"].indexOf(r.category) < 0) return false;
          } else if (r.category !== parts[1]) {
            return false;
          }
        }
      }

      if (!words.length) return true;
      var hay = [
        r.shot, r.group_title, r.paper, r.original_file, r.tunnel_s3_filename,
        r.category, r.brands, r.teams, r.skus, r.description, r.type
      ].join(" ").toLowerCase();
      return words.every(function (w) { return hay.indexOf(w) >= 0; });
    });

    var titles = {
      all: "All Holiday 2026 Studio & 360 Assets",
      photos: "Danny Studio Photography (235 Frames)",
      spins: "OrbitView 360 Spin Videos & Stills (15 Spins)",
      model: "On-Model Studio Photography",
      product: "Product Group & Flat-Lay Photography"
    };
    heading.textContent = titles[state.mode] || "Holiday 2026 Assets";
    countEl.textContent = "Showing " + num(filtered.length) + " of " + num(MANIFEST.length) + " Holiday 2026 assets with verified SKUs.";
    grid.innerHTML = filtered.map(renderHolidayCard).join("") || '<p class="tn-empty">No Holiday 2026 assets matched that filter. Try clearing the search box.</p>';
  }

  function openVendorDialog(slug) {
    var dlg = $("tn-shoot-dialog"), title = $("tn-sd-title"), sub = $("tn-sd-sub"), body = $("tn-sd-body");
    title.textContent = "Loading vendor files...";
    sub.textContent = "";
    body.innerHTML = '<p class="tn-empty">Loading manifest...</p>';
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");

    fetch("files/vendor/" + slug + ".json").then(function (r) { return r.json(); }).then(function (d) {
      title.textContent = d.n || slug;
      var files = d.files || [];
      sub.textContent = num(files.length) + " vendor assets";
      var base = d.s3 || S3_BASE;
      body.innerHTML = '<div class="tn-files-grid">' + files.map(function (f) {
        var fUrl = f.f ? (/^https?:\/\//.test(f.f) ? f.f : base + enc(f.f)) : "";
        var skus = Array.isArray(f.sk) ? f.sk : (f.sk ? [f.sk] : []);
        return '<div class="tn-file">' +
          '<a class="tn-file__thumb" href="' + esc(fUrl) + '" target="_blank" rel="noopener"><img src="' + esc(fUrl) + '" alt="" loading="lazy"></a>' +
          '<div class="tn-file__info">' +
            '<p class="tn-file__name">' + esc(f.f || "Asset") + "</p>" +
            (skus.length ? '<div class="tn-file__skus">' + skus.map(function (s) { return '<span class="tn-file__sku">' + esc(s) + "</span>"; }).join("") + "</div>" : "") +
            '<button type="button" class="tn-btn tn-btn--outline" style="width:100%;padding:6px 10px;font-size:12px" data-copy-url="' + esc(fUrl) + '">Copy Image URL</button>' +
          "</div></div>";
      }).join("") + "</div>";
    });
  }

  iconsEl.addEventListener("click", function (e) {
    var b = e.target.closest("[data-mode]");
    if (b) {
      state.mode = b.getAttribute("data-mode");
      render();
    }
  });

  chipsEl.addEventListener("click", function (e) {
    var c = e.target.closest("[data-chip]");
    if (c) {
      state.chip = c.getAttribute("data-chip");
      render();
    }
  });

  searchInput.addEventListener("input", function (e) {
    state.q = e.target.value;
    render();
  });

  $("tp-search-form").addEventListener("submit", function (e) { e.preventDefault(); });

  document.addEventListener("click", function (e) {
    var copyBtn = e.target.closest("[data-copy-url]");
    if (copyBtn) {
      var u = copyBtn.getAttribute("data-copy-url");
      if (u && navigator.clipboard) {
        navigator.clipboard.writeText(u).then(function () {
          var prev = copyBtn.textContent;
          copyBtn.textContent = "Copied!";
          setTimeout(function () { copyBtn.textContent = prev; }, 1200);
        });
      }
      return;
    }
    var openBtn = e.target.closest("[data-shoot-open]");
    if (openBtn) {
      openVendorDialog(openBtn.getAttribute("data-shoot-open"));
    }
  });

  $("tn-sd-close").addEventListener("click", function () {
    var dlg = $("tn-shoot-dialog");
    if (dlg.close) dlg.close(); else dlg.removeAttribute("open");
  });
  $("tn-shoot-dialog").addEventListener("click", function (e) {
    if (e.target === $("tn-shoot-dialog")) $("tn-sd-close").click();
  });

  Promise.all([
    fetch("data/sdc-holiday-2026-sku-manifest.json").then(function (r) { return r.json(); }),
    fetch("data/data-vendor.json").then(function (r) { return r.json(); }).catch(function () { return null; })
  ]).then(function (res) {
    MANIFEST = res[0] || [];
    VENDOR = res[1] || null;
    render();
  });
})();
</script>
</body>
</html>
