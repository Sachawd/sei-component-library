    width: 100%;

  }
  .wss-deals-team__rail-outer {

    overflow: hidden;
    position: relative;
  }

  .wss-deals-team__rail-outer::after {
    content: "";
    position: absolute;
    top: 0;
    width: 100px;
    height: 100%;
    z-index: 2;
    pointer-events: none;
  }
  .wss-deals-team__rail-outer::before {
    left: 0;
    background: linear-gradient(90deg, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 100%);
  }
  .wss-deals-team__rail-outer::after {
    right: 0;
    background: linear-gradient(270deg, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 100%);
  }
  .wss-deals-team__track {
    display: flex;
    gap: 8px;
    width: max-content;
    animation: wss-logo-scroll 65s linear infinite;
    will-change: transform;
  }
  @keyframes wss-logo-scroll {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }
  /* Logo card: stroke box removed per Sacha 08-27 (no border, no radius,

  .wss-deals-team__logo-card {
    flex: 0 0 100px;
    height: 80px;
    background: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;

    gap: 6px;
    padding: 10px 8px 9px;
    pointer-events: none;
  }
  .wss-deals-team__logo {

    height: 40px;

    display: block;
  }
  .wss-deals-team__name {
    font-family: "PP Fraktion Mono", "Chivo Mono", "Courier New", monospace;
    font-size: 8px;

    line-height: 1.2;
    text-align: center;

  }

    .wss-deals-team__track { animation: none; transform: none; }
    .wss-deals-team__rail-outer { overflow-x: auto; }

})();
