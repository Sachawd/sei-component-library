<!--
  c22-matchup-rail--v1.html
  C-22 · MATCHUP RAIL, instance #1. League-tabbed rail of fixtures and results that
  sits under the site header. Tyler's ask, scoped with Sacha 2026-08-27.
  Built by Claude 2026-08-27 in _CANON_V2, behind the demo.html gate.

  SERIAL: C-22, minted by Fable 2026-08-27 (Sacha delegated). C-21 stays
  reserved for the Quick Links Rail (RUNNING-LIST 08-21). block_id
  c22-matchup-rail--v1 is now permanent: never rename after first deploy.

  ⚠️ SAMPLE DATA. Every match in the SAMPLE_DATA block near the bottom is
  placeholder content for design review. The Premier League fixtures and their
  kickoff times are real (Aug 28-31 2026, from the BBC listing Sacha shared).
  Everything else, and every SCORE in the file, is invented to exercise the
  three card states. None of it is from a live feed. See DATA below.

  DOCTYPE IS THE FIRST BYTE ON PURPOSE (rules B3).

  ── WHAT IT IS ────────────────────────────────────────────────────────────
  Eight league tabs. One rail of match cards per tab. Native overflow-x
  scroll, hairline arrows on desktop only, no dots (canon: a free-scroll rail
  cannot honestly report a page). Team names link to their WSS club landing
  page when one exists; when one does not, the name is plain text.

  Three card states, three chip grounds, and the middle one is a deliberate
  call:
    upcoming    kickoff time in the VIEWER'S timezone, quiet #F0EBE6 chip
    live        reads "IN PROGRESS", inverted chip, NO SCORE IS SHOWN
    final       reads "FT", YELLOW chip, score shown
  A 15-minute-stale live score is wrong and readers notice. A blank one is
  not. This keeps the block honest at a refresh cadence that is not live.

  NO WIN/LOSS STYLING, on purpose. No green, no bold winner, no W/L badge.
  Both teams carry the same weight. ESPN and Fox colour the winner because
  they are sports media. This is a shop, and half of every audience just lost.

  ── DATA ──────────────────────────────────────────────────────────────────
  The block reads ONE JSON payload. It never calls a paid API: the key would
  be in view-source. Shape is normalised by the sync, not raw provider JSON,
  so swapping providers never touches this file.

    DATA_URL = null   → uses the inline SAMPLE_DATA (today, design review)
    DATA_URL = "..."  → fetches that URL, falls back to SAMPLE_DATA on failure

  Planned live path (not built): scheduled sync calls the provider for the
  eight leagues every ~15 min, writes one small JSON, this block reads it.
  Call volume is then fixed regardless of site traffic, which is the whole
  point of the arrangement.

  Payload contract:
    { "generated": ISO8601,
      "leagues": [ { "id", "name", "shopUrl", "matches": [
        { "kickoff": ISO8601 (UTC),
          "status": "upcoming" | "live" | "final",
          "home": { "name", "short"?, "url": string|null, "crest"?: string },
          "away": { "name", "short"?, "url": string|null, "crest"?: string },
          "score": { "home": int, "away": int } | null } ],
        "next": ISO8601 (UTC) | null } ] }

  next is optional: the league's earliest upcoming kickoff, looked up to 14
  days ahead, so a tab with no cards can still say when play resumes.

  short is optional and DISPLAY ONLY. Long names do not fit beside a crest and
  a score, so the sample carries: Brighton, Wolves, Nottm Forest, PSG,
  Marseille, Lyon. aria-label always uses the full name.
  crest is optional. Omit it and the club renders as initials.

  url:null is REQUIRED for any club with no landing page. The renderer prints
  those as plain text. It never constructs a /shop/clubs/ URL from a name
  (THE URL RULE, Sacha 08-03). Six clubs in the sample are deliberately
  unmapped so the fallback is visible in review: Nottingham Forest, Brentford,
  Leeds United, Ipswich Town, Wolverhampton Wanderers, AS Monaco. Wolves is
  the useful one to look at: it has a crest but no landing page, so it shows
  the badge and plain, unlinked text.

  ── LINKS ─────────────────────────────────────────────────────────────────
  Every club URL and every league URL below is copied from the link book
  (site-links.csv, groups site-page and club-landing). None invented.
  Club rows used: arsenal, manchester-city, liverpool, tottenham,
  manchester-united, newcastle-united, aston-villa, brighton-hove-albion,
  everton, afc-bournemouth, fulham-fc, crystal-palace, sunderland, burnley,
  barcelona, real-madrid, atletico-madrid, sevilla, valencia, ac-milan,
  inter-milan, juventus, napoli, as-roma, bayern-munich, borussia-dortmund,
  paris-saint-germain, olympique-marseille, olympique-lyonnais, lafc,
  atlanta-united, la-galaxy, seattle-sounders, miami-cf, chivas, club-america,
  cruz-azul, tigres-uanl, monterrey, pumas-unam.
  League rows used: leagues-premier-league, leagues-la-liga, leagues-serie-a,
  leagues-bundesliga, leagues-ligue-1, leagues-mls, leagues-liga-mx, and
  tournaments-uefa-champions-league.

  ⚠️ CHELSEA IS ABSENT FROM THIS SAMPLE ONLY — and the question is now CLOSED.
  When this sample was written the reason for the C-14 pull was unknown, so
  the cautious choice was to leave Chelsea out. The reason is on the record
  (RUNNING-LIST, Fable 2026-08-21): what was pulled was the **Chelsea 26/27
  Third jersey card**, because that product had not launched — its date moved
  to Fri 18 Sep 2026. The rule it broke was "pre-launch content never on a
  public URL". It was never about the club.
  THEREFORE Chelsea is fine here: this block ships no product imagery, and it
  links to /shop/clubs/chelsea, which is live and in the link book (Chelsea
  Away is still in C-14 and C-13 today). With DATA_URL live, Chelsea appears
  from the feed like any other club, which is correct. Verified 2026-08-28.

  ── CRESTS · THE S3 BUCKET, NOT FASTR (Sacha's call, 08-27) ───────────────
  Serving URL: https://www.imagehandler.net/dxassets/?img=Photos/logos/<file>
  PNG, which is the canon crest format (AGENTS.md: JPEG for photography, PNG
  for crests, never SVG or WebP). Every filename below was read off Sacha's
  own screenshots of /dxassets/Photos/logos/ on 2026-08-27.

  WHY THIS SOURCE. v2 of this block used images.getfastr.com URLs copied from
  promo-lightbox--clubs-v1.html. Sacha's instruction on 08-27: the Airtable
  creative data points at Fastr URLs, but new work moves to the bucket. So all
  crests were re-pointed. The Fastr URLs still work and are still in the
  lightboxes; nothing there was touched.

  ⚠️ NOT ONE OF THESE HAS BEEN SEEN TO RENDER, BY ANYONE. The imagehandler
  returns 400 to non-browser fetches, and Sacha explicitly asked that no agent
  call the bucket. So the first look is a human opening demo.html. If every
  badge is an initials fallback, check the PATH PREFIX first: this file assumes
  the handler wants "Photos/logos/<file>", mirroring the bucket layout. That
  assumption is the single most likely thing to be wrong.

  COVERAGE. 46 of the 47 clubs in the sample. ONE is still missing and falls
  back to initials:
    Burnley   (Sacha uploading, 08-27)
  Sacha uploaded Marseille, Sunderland and Leeds to the bucket on 08-27 after
  seeing this block's gap list; those three are wired in.
  The bucket also beat the Fastr set: Nottingham Forest, Brentford, Ipswich
  Town and AS Monaco all exist here and did not in the lightbox.

  ⚠️ MARSEILLE IS THE CAUTIONARY ONE. Its file is
  club_olympique-de-marseille.png. The derivable guess from the club name, and
  from its sibling club_olympique-lyonnais.png, would have been
  club_olympique-marseille.png, which does not exist. That single "de" is the
  whole argument for the rule below: read every filename off a listing, never
  construct one.

  NAMING IS INCONSISTENT IN THE BUCKET, so no filename can be derived from a
  club name. Every one has to be read off the listing. Three prefixes are in
  use: club_ (most), clubs_ (the Bundesliga set, e.g. clubs_dortmund.png), and
  no prefix at all (MLS and NWSL, e.g. lafc.png, la_galaxy.png). Separators
  are hyphens inside club_/clubs_ names but underscores in the MLS ones.
  Two clubs appear twice under different names: club_barcelona.png and
  club_fc-barcelona.png, club_bayern-munich.png and clubs_bayern-munich.png.
  This file uses the club_ spelling of both.
  There are also misspelled filenames in the bucket (club_atletic-bilbao,
  club_alvaves, club_caligari, club_socciedad, club_vallencano, club_pachua,
  clubs_ausburg, clubs_darmstsdt, clubs_hamburge, clubs_karslruher,
  clubs_weder-bremen). None affect the 47 clubs here, but they matter the
  moment this block covers more of a league: the filename is a query
  parameter, so a corrected spelling is a 404.

  ALSO IN THE BUCKET, not used yet: league_premier-league.png,
  league_la-liga.png, league_serie-a.png, league_bundesliga.png,
  league_ligue-1.png, league_mls.png, league_liga-mx.png and league_nwsl.png.
  Seven of the eight tabs could carry a league mark. There is no Champions
  League file, so the tabs stay text for now rather than going 7 of 8.
  There is also Placeholder_Team_Logo.png, an alternative to the initials
  fallback. Not used: initials tell you which club, a generic badge does not.

  THE FALLBACK. The crest slot is an EXACT box, so a missing crest never
  shifts the name. Initials sit under the image: if a URL dies, one
  self-disarming onerror fades the img and the initials show through, which is
  the same rendering a club with no crest URL gets. No club ever gets a
  guessed image URL.

  ── HEIGHT BUDGET (A4) ────────────────────────────────────────────────────
  Fixed px, measured in headless Chromium 2026-08-27 under a system fallback
  face (Google Fonts blocked in the sandbox), so the numbers are font
  independent by construction: every box is explicit.
    <640px    TOTAL 220   head 34 + 14 + tabs 36 + 14 + card 240 x 110 + pad 12
    >=640px   TOTAL 224   head 34 + 14 + tabs 36 + 14 + card 254 x 114 + pad 12
    >=1024px  TOTAL 228   head 34 + 14 + tabs 36 + 14 + card 268 x 118 + pad 12
  Was 232 / 238 / 242 in v1. Sacha, 08-27: "we're in an ecommerce store, make
  the cards and the fonts a little smaller." Card heights came down 16px and
  the type dropped a notch (team 15 to 14, meta and chip 11 to 10). The tabs
  went UP 4px, from a 32px boxed chip to the C-19 36px strip (34 label + 2px
  rule), and still read lighter because there is no box.
  Deliberately small. Sacha's brief was a ticker that can sit under the site
  header, so the whole block is shorter than one C-20 tile. Card sizes are
  PROPOSED, there is no Figma node for this yet. One variable each to change:
  --mr-card-w / --mr-card-h. The height does not move when the tab changes,
  because the value column is a fixed 20px and empty in the non-final states.

/* ═══ MATCHUP RAIL · canon v2 chassis ══════════════════════════════════════
   Type and arrow spec follow the C-20 shop-by rail so the two read as one
   family. Sizes here are this block's own. */
:root{
  --mr-ground:#FFFFFF;
  --mr-ink:#131313;
  --mr-muted:#797474;
  --mr-hairline:#E5E1DD;
  --mr-card-ground:#FFFFFF;
  --mr-chip-ground:#F0EBE6;
  /* FT chip yellow (Sacha, 08-27: "if it's a full time match that chip could
     be yellow, so you can visually see the difference"). Cabana global token
     colors/Yellow/300. Softer option is Yellow/200 #FEF08A, brighter is
     Yellow/400 #FACC15. Ink stays #131313, which clears AA on all three. */
  --mr-chip-ft:#FDE047;
  --mr-focus:#C4623F;

  --mr-font:'Chakra Petch',Figtree,system-ui,sans-serif;
  --mr-title-font:'Mohave','Chakra Petch',Figtree,system-ui,sans-serif;

  --mr-ease:cubic-bezier(.25,1,.5,1);
  --mr-dur:.4s;

  --mr-arrow-size:34px;
  --mr-arrow-ground:#FFFFFF;
  --mr-arrow-ink:#131313;
  --mr-arrow-line:#797474;
  --mr-arrow-ground-hover:#131313;
  --mr-arrow-ink-hover:#FFFFFF;

  /* mobile first */
  --mr-gutter:16px;
  --mr-gap:8px;
  --mr-title-size:20px;
  --mr-head-h:34px;
  --mr-head-gap:14px;
  --mr-tabs-h:36px;                    /* C-19 strip: 34 label + 2 rule, exact */
  --mr-tabs-gap:14px;
  --mr-tab-gap:10px;
  --mr-tab-pad:10px;
  --mr-rule-idle:#D9D9D9;              /* C-19 --sel-rule-idle */
  --mr-rule-active:#000000;            /* C-19 --sel-rule-active */
  --mr-card-w:240px;
  --mr-card-h:110px;
  --mr-pad-bottom:12px;

  /* type, one notch down from v1 after Sacha's 08-27 note that an
     ecommerce header strip should not shout */
  --mr-team-size:14px;
  --mr-meta-size:10px;
  --mr-tab-size:13px;
  --mr-crest:18px;
}
@media (min-width:640px){
  :root{ --mr-gutter:24px; --mr-title-size:24px; --mr-tab-gap:12px; --mr-tab-pad:12px;
         --mr-card-w:254px; --mr-card-h:114px; --mr-crest:20px; }
}
@media (min-width:1024px){
  :root{ --mr-gutter:12px; --mr-title-size:26px; --mr-tab-gap:12px; --mr-tab-pad:14px;
         --mr-card-w:268px; --mr-card-h:118px; --mr-crest:20px; }
}

*,*::before,*::after{box-sizing:border-box}
html,body{
  margin:0;padding:0;
  background:var(--mr-ground);
  overflow-x:hidden;overflow-y:hidden;   /* the iframe is an exact height */
  touch-action:pan-y;                    /* B4: the page keeps the vertical axis */
}
html.is-standalone,html.is-standalone body{overflow-y:auto}   /* direct-open preview only */

.mr{
  position:relative;
  width:100%;
  padding-bottom:var(--mr-pad-bottom);
  background:var(--mr-ground);
  font-family:var(--mr-font);
  color:var(--mr-ink);
  -webkit-font-smoothing:antialiased;
}

/* ═══ HEAD · title left, shop CTA right. One row, exact height. ═══ */
.mr-head{
  height:var(--mr-head-h);
  margin-bottom:var(--mr-head-gap);
  padding:0 var(--mr-gutter);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.mr-head__title{
  margin:0;
  font-family:var(--mr-title-font);
  font-weight:600;
  font-size:var(--mr-title-size);
  line-height:var(--mr-head-h);
  letter-spacing:.01em;
  text-transform:uppercase;
  white-space:nowrap;
}
/* actions cluster: CTA, then the arrows. Arrows live HERE, not overlaying the
   rail: these cards are white with text in them, so an overlay arrow sits on
   top of a club name. The C-20 rails can overlay because their tiles are
   photos. Same arrow spec, different placement. */
.mr-head__actions{
  flex:0 0 auto;
  display:flex;align-items:center;gap:10px;
}
.mr-head__cta{
  flex:0 0 auto;
  display:inline-flex;align-items:center;gap:6px;
  font-size:13px;font-weight:600;line-height:1;
  letter-spacing:.08em;text-transform:uppercase;
  color:var(--mr-ink);text-decoration:none;
  border-bottom:1px solid var(--mr-ink);
  padding-bottom:3px;
  transition:opacity var(--mr-dur) var(--mr-ease);
}
.mr-head__cta:focus-visible{outline:2px solid var(--mr-focus);outline-offset:3px}
@media (hover:hover) and (pointer:fine){ .mr-head__cta:hover{opacity:.6} }
/* Below 640 the league name does not fit beside the title on a 360px phone,
   so the CTA collapses to "Shop". The aria-label always carries the league. */
.mr-cta__long{display:none}
.mr-cta__short{display:inline}
@media (min-width:640px){
  .mr-cta__long{display:inline}
  .mr-cta__short{display:none}
}

/* ═══ TABS · the C-19 Selection Section pattern (Sacha, 08-27: "slimmer tabs
   as on C-19"). Label plus a 2px rule, no box, no fill. Idle and active
   colours are C-19's --sel-rule-idle / --sel-rule-active verbatim.
   Hidden until the script runs: no JS means no working tabs, so the control
   is not offered at all (same reasoning as C-19). ═══ */
.mr-tabs{display:none}
.mr.is-ready .mr-tabs{
  height:var(--mr-tabs-h);
  margin-bottom:var(--mr-tabs-gap);
  padding:0 var(--mr-gutter);
  display:flex;align-items:flex-start;gap:var(--mr-tab-gap);
  overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
  touch-action:pan-x pan-y;
}
.mr.is-ready .mr-tabs::-webkit-scrollbar{display:none}
.mr-tab{
  flex:0 0 auto;
  display:flex;flex-direction:column;align-items:stretch;
  background:none;border:0;padding:0;margin:0;cursor:pointer;
  font-family:inherit;color:inherit;
  -webkit-tap-highlight-color:transparent;
}
.mr-tab__label{
  display:flex;align-items:center;justify-content:center;
  height:34px;                          /* exact, so the 36px strip is exact */
  padding:0 var(--mr-tab-pad);
  font-size:var(--mr-tab-size);font-weight:600;line-height:1;
  letter-spacing:.08em;text-transform:uppercase;
  color:var(--mr-muted);
  white-space:nowrap;
  transition:color var(--mr-dur) var(--mr-ease);
}
.mr-tab__rule{
  height:2px;
  background:var(--mr-rule-idle);
  transition:background var(--mr-dur) var(--mr-ease);
}
.mr-tab[aria-selected="true"] .mr-tab__label{color:var(--mr-ink)}
.mr-tab[aria-selected="true"] .mr-tab__rule{background:var(--mr-rule-active)}
@media (hover:hover) and (pointer:fine){
  .mr-tab:hover .mr-tab__label{color:var(--mr-ink)}
  .mr-tab:hover .mr-tab__rule{background:#9A938B}
  .mr-tab[aria-selected="true"]:hover .mr-tab__rule{background:var(--mr-rule-active)}
}
.mr-tab:focus-visible{outline:2px solid var(--mr-focus);outline-offset:2px}

/* ═══ RAIL ═══ */
.mr-rail{
  display:flex;
  gap:var(--mr-gap);
  padding:0 var(--mr-gutter);
  overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x proximity;
  scroll-padding-inline-start:var(--mr-gutter);
  scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  touch-action:pan-x pan-y;
}
.mr-rail::-webkit-scrollbar{display:none}

/* ═══ CARD ═══ */
.mr-card{
  flex:0 0 auto;
  width:var(--mr-card-w);
  height:var(--mr-card-h);
  display:flex;flex-direction:column;
  padding:12px;
  border:1px solid var(--mr-hairline);
  background:var(--mr-card-ground);
  scroll-snap-align:start;
}
.mr-card__meta{
  font-size:var(--mr-meta-size);font-weight:600;line-height:1;
  letter-spacing:.1em;text-transform:uppercase;
  color:var(--mr-muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.mr-card__rows{
  flex:1 1 auto;
  display:flex;flex-direction:column;justify-content:center;gap:6px;
  min-height:0;
}
.mr-row{
  display:flex;align-items:center;gap:8px;
  /* value column is a FIXED width so cards do not jitter between states */
  }

/* ═══ CREST · exact box, so a missing crest never moves the name ═══════════
   The initials sit UNDER the image. One self-disarming onerror fades the img
   and the initials show through, which is also what happens when a club has
   no crest URL at all and no <img> is written. Rule D-images: exactly one
   onerror, never a loop. */
.mr-crest{
  position:relative;
  flex:0 0 var(--mr-crest);
  width:var(--mr-crest);height:var(--mr-crest);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.mr-crest__initials{
  font-size:9px;font-weight:700;line-height:1;
  letter-spacing:.02em;
  color:var(--mr-muted);
}
.mr-crest__img{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:contain;
  display:block;border:0;
}
.mr-team{
  flex:1 1 auto;min-width:0;
  font-size:var(--mr-team-size);font-weight:600;line-height:1.1;
  color:var(--mr-ink);text-decoration:none;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
a.mr-team{border-bottom:1px solid transparent;transition:border-color var(--mr-dur) var(--mr-ease)}
a.mr-team:focus-visible{outline:2px solid var(--mr-focus);outline-offset:2px}
@media (hover:hover) and (pointer:fine){
  a.mr-team:hover{border-bottom-color:var(--mr-ink)}
}
.mr-val{
  flex:0 0 20px;
  text-align:right;
  font-size:var(--mr-team-size);font-weight:700;line-height:1.1;
  font-variant-numeric:tabular-nums;
  color:var(--mr-ink);
}
.mr-card__foot{ display:flex;align-items:center }
.mr-status{
  display:inline-flex;align-items:center;
  height:18px;padding:0 6px;
  background:var(--mr-chip-ground);
  color:var(--mr-ink);
  font-size:var(--mr-meta-size);font-weight:600;line-height:1;
  letter-spacing:.08em;text-transform:uppercase;
  white-space:nowrap;
}
/* three chips, three grounds: upcoming is quiet, FT is yellow so a played
   match is findable at a glance, in progress is inverted. */
.mr-card[data-status="final"] .mr-status{ background:var(--mr-chip-ft) }
.mr-card[data-status="live"]  .mr-status{ background:var(--mr-ink);color:#FFFFFF }

/* ═══ THE CTA · canon v2, copied verbatim from css/cta-canon.css ═══════════
   Used by the empty state's shop button. Do not edit here; edit the canon. */
:root{
  /* ── Osmo 009 API, re-pointed at WSS values ── */
  --button-009-color:#fff;
  --button-009-color-background:#000;
  --button-009-color-focus:#000;
  --button-009-border-radius:0;

/* ═══ OSMO BUTTON 009 — VERBATIM ═════════════════════════════════════════ */
.button-009{
  color:var(--button-009-color);
  -webkit-user-select:none;user-select:none;
  background-color:#0000;
  outline-style:none;
  padding:0;
  line-height:1;
  text-decoration:none;
  display:inline-grid;
  position:relative;
  -webkit-tap-highlight-color:transparent;
  transition:scale 0.15s var(--button-009-ease-click);
}
.button-009::after{
  content:'';display:block;position:absolute;
  inset:var(--button-009-focus-inset);
  border-radius:var(--button-009-border-radius);
  transition:box-shadow 0.3s var(--button-009-ease-focus);
  pointer-events:none;z-index:1;
}
.button-009:is(:focus-visible)::after{ box-shadow:0 0 0 0.125em var(--button-009-color-focus); }
.button-009:active{ scale:var(--button-009-click-scale); }
.button-009__inner{
  pointer-events:none;
  grid-column-gap:var(--button-009-gap);
  grid-row-gap:var(--button-009-gap);
  padding-top:var(--button-009-padding-top);
  padding-right:var(--button-009-padding-right);
  padding-bottom:var(--button-009-padding-bottom);
  padding-left:var(--button-009-padding-left);
  z-index:1;
  border-radius:var(--button-009-border-radius);
  overflow:var(--button-009-overflow);
  grid-area:1 / 1;
  justify-content:center;align-items:center;
  display:flex;position:relative;
}
.button-009__icon{
  width:var(--button-009-icon-size);
  height:var(--button-009-icon-size);
  flex:none;
  transition:translate 0.5s var(--button-009-ease-hover), opacity 0.15s ease-out;
}
.button-009__icon.is--left{
  left:var(--button-009-padding-right);
  position:absolute;
  opacity:0;
  translate:-1.5em 0 0;
}
.button-009__text{ flex:none; transition:translate 0.5s var(--button-009-ease-hover); }
.button-009__bg{
  background-color:var(--button-009-color-background);
  border-radius:var(--button-009-border-radius);
  grid-area:1 / 1;width:100%;height:100%;padding:0;
}
@media (hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference){

  [data-hover]:is(:hover, :focus-visible) .button-009 .button-009__text{
    translate:calc(var(--button-009-icon-size) + var(--button-009-gap) + var(--button-009-padding-right) - var(--button-009-padding-left)) 0 0;
    transition:translate 0.5s 0.075s var(--button-009-ease-hover);
  }
  .button-009:is(:hover, :focus-visible) .button-009__icon.is--left,
  [data-hover]:is(:hover, :focus-visible) .button-009 .button-009__icon.is--left{
    translate:0 0 0;opacity:1;
    transition:translate 0.5s 0.075s var(--button-009-ease-hover), opacity 0.15s 0.075s ease-out;
  }
  .button-009:is(:hover, :focus-visible) .button-009__icon.is--right,
  [data-hover]:is(:hover, :focus-visible) .button-009 .button-009__icon.is--right{
    translate:1.5em 0 0;opacity:0;
    transition:translate 0.5s 0.05s var(--button-009-ease-hover), opacity 0.15s 0.075s ease-out;
  }
}

/* ── THEMES (Osmo's documented data-theme pattern) ───────────────────────── */

/* secondary — outlined, for light grounds */
.button-009[data-theme='secondary']{
  --button-009-color:#000;
  --button-009-color-background:#fff;
}
.button-009[data-theme='secondary'] .button-009__bg{ border:var(--ws-cta-hairline); }

/* on-dark — for the C-13 wall (#0A0A0A) and any dark surface.
   REASON THIS EXISTS: the default focus ring is #000 and disappears completely
   against the wall's ground, so keyboard users lose the focus indicator. White
   ground reads on dark and the ring flips to white. Osmo's accessibility note
   calls this out: --button-009-color-focus must contrast with the SURROUNDING
   background, not the button.
   ⚠️ Theme name is arbitrary. Rename freely. */
.button-009[data-theme='on-dark']{
  --button-009-color:#0A0A0A;
  --button-009-color-background:#fff;
  --button-009-color-focus:#fff;
}

/* ═══ EMPTY STATE · a league with nothing in the window ═══
   Next kickoff (or "No matches scheduled") with a shop link under it. The
   box is exactly one card tall, so the block height never moves. */
.mr-empty{
  flex:0 0 auto;
  display:flex;flex-direction:column;justify-content:center;align-items:flex-start;
  gap:12px;
  height:var(--mr-card-h);
  padding:0 4px;
}
/* Message sits between the card text (14px) and the block title (20/24/26px).
   Box: 20 message + 12 gap + 39 button = 71, inside the 110/114/118 card. */
.mr-empty__msg{
  margin:0;                 /* <p> default margins broke the height budget on empty tabs */
  font-size:16px;font-weight:600;line-height:1.25;letter-spacing:.04em;text-transform:uppercase;
  color:var(--mr-muted);    /* #797474 on #FFFFFF = 4.6:1, AA pass */
}
@media (min-width:640px){ .mr-empty__msg{font-size:18px;line-height:1.1112} }

/* ═══ ARROWS · desktop with a mouse only, and only when the rail overflows ═══ */
.mr-arrow{

             color var(--mr-dur) var(--mr-ease),
             transform .15s var(--mr-ease);
}
.mr-arrow svg{width:16px;height:16px;display:block}
.mr-arrow--prev svg{transform:rotate(180deg)}
@media (hover:hover) and (pointer:fine) and (min-width:1024px){
  .mr.is-ready.has-overflow .mr-arrow{display:flex}
  .mr-arrow:hover{background:var(--mr-arrow-ground-hover);color:var(--mr-arrow-ink-hover)}
}
.mr-arrow:active{transform:scale(.94)}
.mr-arrow:focus-visible{outline:2px solid var(--mr-focus);outline-offset:2px}
.mr-arrow[disabled]{opacity:.35;pointer-events:none}

.mr-noscript{
  padding:0 var(--mr-gutter);
  font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--mr-muted);
}

@media (prefers-reduced-motion:reduce){
  .mr-rail{scroll-behavior:auto}

}

            "home":{"name":"Club America","url":"https://www.worldsoccershop.com/shop/clubs/club-america","crest":"https://www.imagehandler.net/dxassets/?img=Photos/logos/club_club-america.png"},
            "away":{"name":"Chivas","url":"https://www.worldsoccershop.com/shop/clubs/chivas","crest":"https://www.imagehandler.net/dxassets/?img=Photos/logos/club_chivas.png"},
            "score":{"home":2,"away":1} },
          { "kickoff":"2026-08-29T02:00:00Z", "status":"upcoming",
            "home":{"name":"Cruz Azul","url":"https://www.worldsoccershop.com/shop/clubs/cruz-azul","crest":"https://www.imagehandler.net/dxassets/?img=Photos/logos/club_cruz-azul.png"},
            "away":{"name":"Pumas UNAM","url":"https://www.worldsoccershop.com/shop/clubs/pumas-unam","crest":"https://www.imagehandler.net/dxassets/?img=Photos/logos/club_pumas.png"},
            "score":null },
          { "kickoff":"2026-08-30T03:05:00Z", "status":"upcoming",
            "home":{"name":"Tigres UANL","url":"https://www.worldsoccershop.com/shop/clubs/tigres-uanl","crest":"https://www.imagehandler.net/dxassets/?img=Photos/logos/club_tigres.png"},
            "away":{"name":"Monterrey","url":"https://www.worldsoccershop.com/shop/clubs/monterrey","crest":"https://www.imagehandler.net/dxassets/?img=Photos/logos/club_monterrey.png"},
            "score":null }
        ]
      }
    ]
  };

  var root  = document.getElementById('mr');    if(!root) return;
  var rail  = document.getElementById('mr-rail');
  var tabs  = document.getElementById('mr-tabs');
  var cta   = document.getElementById('mr-cta');
  var prev  = root.querySelector('[data-mr="prev"]');
  var next  = root.querySelector('[data-mr="next"]');
  if(!rail || !tabs) return;

  try{ if(window.self===window.top) document.documentElement.classList.add('is-standalone'); }catch(e){}

  var DATA = SAMPLE_DATA;
  var active = 0;

  /* ── formatting ─────────────────────────────────────────────────────── */
  function fmtDate(iso){
    var d = new Date(iso);
    if(isNaN(d)) return '';
    try{
      /* comma stripped: the meta line is uppercased, and "SUN, AUG 23" reads
         worse than "SUN AUG 23". Order still follows the viewer's locale. */
      return new Intl.DateTimeFormat(undefined,{weekday:'short',day:'numeric',month:'short'})
        .format(d).replace(/,/g,'');
    }catch(e){
      return d.toDateString().slice(0,10);
    }
  }
  function fmtTime(iso){
    var d = new Date(iso);
    if(isNaN(d)) return '';
    try{
      return new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit'}).format(d);
    }catch(e){
      return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
    }
  }

  /* "Sat 3 Oct", in the viewer's timezone. Day-before-month is Sacha's
     ruling for this line (24 Sept), so the locale is fixed here. */
  function fmtNext(iso){
    var d = new Date(iso);
    if(isNaN(d)) return '';
    try{
      return new Intl.DateTimeFormat('en-GB',{weekday:'short',day:'numeric',month:'short'})
        .format(d).replace(/,/g,'');
    }catch(e){
      var p = d.toDateString().split(' ');
      return p[0] + ' ' + Number(p[2]) + ' ' + p[1];
    }
  }
  function upcomingNext(league){
    var iso = league && typeof league.next === 'string' ? league.next : null;
    var d = iso ? new Date(iso) : null;
    return (d && !isNaN(d) && d.getTime() > Date.now()) ? iso : null;
  }
  function emptyEl(league){
    var box = document.createElement('div');
    box.className = 'mr-empty';
    var msg = document.createElement('p');
    msg.className = 'mr-empty__msg';
    var nx = upcomingNext(league);
    msg.textContent = nx ? 'Next match ' + fmtNext(nx) : 'No matches scheduled';
    box.appendChild(msg);
    if(typeof league.shopUrl === 'string' && league.shopUrl){
      /* canon CTA markup, built in script because the league changes */
      var a = document.createElement('a');
      a.className = 'button-009';
      a.setAttribute('data-button-009','');
      a.href = league.shopUrl;
      a.target = '_top';
      a.setAttribute('aria-label', 'Shop ' + league.name);
      var inner = document.createElement('span');
      inner.className = 'button-009__inner';
      var icon = function(side){
        var sp = document.createElement('span');
        sp.className = 'button-009__icon is--' + side;
        sp.setAttribute('aria-hidden','true');
        var i = document.createElement('i');
        i.textContent = '\u2192';
        sp.appendChild(i);
        return sp;
      };
      var t = document.createElement('span');
      t.className = 'button-009__text';
      t.textContent = 'Shop ' + league.name;
      inner.appendChild(icon('left')); inner.appendChild(t); inner.appendChild(icon('right'));
      var bg = document.createElement('span');
      bg.className = 'button-009__bg';
      a.appendChild(inner); a.appendChild(bg);
      box.appendChild(a);
    }
    return box;
  }

  /* ── build one card. Text goes in via textContent, never innerHTML, so a
        club name can never inject markup. ─────────────────────────────── */
  /* Two letters, used when a club has no crest. Never a guessed image. */
  function initialsOf(name){
    var parts = String(name || '').replace(/[^A-Za-z0-9 ]/g,' ').split(/\s+/).filter(Boolean);
    if(!parts.length) return '';
    if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
    return (parts[0].charAt(0) + parts[1].charAt(0)).toUpperCase();
  }
  function crestEl(team){
    var slot = document.createElement('span');
    slot.className = 'mr-crest';
    var ini = document.createElement('span');
    ini.className = 'mr-crest__initials';
    ini.textContent = initialsOf(team && team.name);
    slot.appendChild(ini);
    var url = (team && typeof team.crest === 'string' && team.crest) ? team.crest : null;
    if(url){
      var img = document.createElement('img');
      img.className = 'mr-crest__img';
      img.alt = '';
      img.loading = 'lazy';
      img.decoding = 'async';
      /* exactly ONE self-disarming onerror, never a loop (rule D-images).
         On failure the crest fades and the initials underneath show. */
      img.onerror = function(){ this.onerror = null; this.style.opacity = '0'; };
      img.src = url;
      slot.appendChild(img);
    }
    return slot;
  }
  function teamEl(team){
    var hasUrl = team && typeof team.url === 'string' && team.url;
    var el = document.createElement(hasUrl ? 'a' : 'span');
    el.className = 'mr-team';
    /* short is optional and display only. Long names like Wolverhampton
       Wanderers do not fit beside a crest and a score. */
    el.textContent = (team && (team.short || team.name)) ? (team.short || team.name) : '';
    if(hasUrl){
      el.href = team.url;
      el.target = '_top';                       /* iframe: break out to the page */
      el.setAttribute('aria-label','Shop ' + (team.name || el.textContent));
    }
    return el;
  }
  function rowEl(team, value){
    var row = document.createElement('div');
    row.className = 'mr-row';
    row.appendChild(crestEl(team));
    row.appendChild(teamEl(team));
    var val = document.createElement('span');
    val.className = 'mr-val';
    val.textContent = (value === null || value === undefined) ? '' : String(value);
    row.appendChild(val);
    return row;
  }
  function cardEl(m){
    var card = document.createElement('article');
    card.className = 'mr-card';
    card.setAttribute('role','listitem');
    card.setAttribute('data-status', m.status || 'upcoming');

    var meta = document.createElement('div');
    meta.className = 'mr-card__meta';
    meta.textContent = fmtDate(m.kickoff);
    card.appendChild(meta);

    /* live shows NO score, on purpose. See the header note. */
    var showScore = (m.status === 'final') && m.score;
    var rows = document.createElement('div');
    rows.className = 'mr-card__rows';
    rows.appendChild(rowEl(m.home, showScore ? m.score.home : null));
    rows.appendChild(rowEl(m.away, showScore ? m.score.away : null));
    card.appendChild(rows);

    var foot = document.createElement('div');
    foot.className = 'mr-card__foot';
    var chip = document.createElement('span');
    chip.className = 'mr-status';
    if(m.status === 'final')      chip.textContent = 'FT';
    else if(m.status === 'live')  chip.textContent = 'In progress';
    else                          chip.textContent = fmtTime(m.kickoff);
    foot.appendChild(chip);
    card.appendChild(foot);

    return card;
  }

  /* ── render ─────────────────────────────────────────────────────────── */
  function renderRail(){
    var league = DATA.leagues[active];
    rail.textContent = '';
    if(!league) return;

    if(cta && league.shopUrl){
      cta.href = league.shopUrl;
      var ctaLong = document.getElementById('mr-cta-long');
      if(ctaLong) ctaLong.textContent = 'Shop ' + league.name;
      cta.setAttribute('aria-label', 'Shop ' + league.name);
    }

    var list = (league.matches || []).slice().sort(function(a,b){
      return new Date(a.kickoff) - new Date(b.kickoff);
    });

    if(!list.length){
      rail.appendChild(emptyEl(league));
    } else {
      var frag = document.createDocumentFragment();
      for(var i=0;i<list.length;i++) frag.appendChild(cardEl(list[i]));
      rail.appendChild(frag);
    }
    rail.scrollLeft = 0;
    sync();
  }

  function renderTabs(){
    tabs.textContent = '';
    DATA.leagues.forEach(function(lg, i){
      var b = document.createElement('button');
      b.className = 'mr-tab';
      b.type = 'button';
      b.setAttribute('role','tab');
      b.setAttribute('aria-selected', i === active ? 'true' : 'false');
      var lab = document.createElement('span');
      lab.className = 'mr-tab__label';
      lab.textContent = lg.name;
      var rule = document.createElement('span');
      rule.className = 'mr-tab__rule';
      b.appendChild(lab); b.appendChild(rule);
      b.addEventListener('click', function(){
        if(i === active) return;
        active = i;
        renderTabs();
        renderRail();
      });
      tabs.appendChild(b);
    });
  }

  /* ── arrows ─────────────────────────────────────────────────────────── */
  function sync(){
    var over = rail.scrollWidth - rail.clientWidth > 2;
    root.classList.toggle('has-overflow', over);
    if(!over){
      if(prev) prev.disabled = true;
      if(next) next.disabled = true;
      return;
    }
    var x = rail.scrollLeft;
    if(prev) prev.disabled = x <= 2;
    if(next) next.disabled = x >= (rail.scrollWidth - rail.clientWidth - 2);
  }
  function step(d){
    var c = rail.querySelector('.mr-card');
    var by = c ? (c.getBoundingClientRect().width + 8) : Math.round(rail.clientWidth * 0.8);
    rail.scrollBy({left: d * by, behavior:'smooth'});
  }
  if(prev) prev.addEventListener('click', function(){ step(-1); });
  if(next) next.addEventListener('click', function(){ step(1); });
  rail.addEventListener('scroll', sync, {passive:true});
  var rt;
  window.addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(sync,120); }, {passive:true});

  /* ── boot ───────────────────────────────────────────────────────────── */
  /* Open on the first tab, in tab order, that has a match to show. */
  function firstLive(){
    for(var i=0;i<DATA.leagues.length;i++){
      var m = DATA.leagues[i] && DATA.leagues[i].matches;
      if(m && m.length) return i;
    }
    return 0;
  }

  function boot(){
    active = firstLive();
    renderTabs();
    renderRail();
    root.classList.add('is-ready');
    /* bring an off-screen default tab into view. scrollLeft, not
       scrollIntoView, which can scroll the parent page. */
    var sel = tabs.children[active];
    if(sel && active > 0){
      var over = sel.getBoundingClientRect().right - tabs.getBoundingClientRect().right;
      if(over > 0) tabs.scrollLeft += over + 16;
    }
    if(document.fonts && document.fonts.ready && typeof document.fonts.ready.then === 'function'){
      document.fonts.ready.then(sync);
    }
  }

  if(DATA_URL){
    /* Live path. A failed fetch keeps the last shipped payload rather than
       showing an empty band. Never blocks first paint for long: same-origin
       CDN JSON, and boot() runs either way. */
    var done = false;
    var finish = function(){ if(!done){ done = true; boot(); } };
    setTimeout(finish, 4000);
    try{
      fetch(DATA_URL, {cache:'no-store'})
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(j){ if(j && j.leagues && j.leagues.length) DATA = j; })
        .catch(function(){})
        .then(finish);
    }catch(e){ finish(); }
  } else {
    boot();
  }
})();
</script>


<!-- WSS-CLICK-BEACON — attribution-safe click tracking (rules D2). Posts clicks to the
     parent page; pair with Rules and Resources/fastr-parent-click-listener.html. -->
<script>
(function () {
  var BLOCK = "fastr_blocks_c22_matchup_rail_v1";
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null;
    if (!a) return;
    try {
      window.parent.postMessage({
        type: "wss-block-click",
        block: BLOCK,
        label: (a.getAttribute("aria-label") || a.textContent || "").replace(/\s+/g, " ").trim().slice(0, 80),
        href: a.href
      }, "*");
    } catch (err) { /* fire-and-forget */ }
  }, true);
})();
</script>
