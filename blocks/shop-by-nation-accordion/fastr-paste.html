    --theme-text-oninvert ........ exists in production ... kept
    --theme-bg-subtle ............ exists in production ... kept
    --theme-bg-primary-normal .... exists in production ... kept
    --font-body .................. DOES NOT EXIST ......... removed
  There is no production font token. Both reference components declare their
  own local font variable and put the real stack in it, so this one does the
  same with --sdc-ta-font. Typography ships as utility classes, not tokens.
  No name here can have its fallback win silently.

  IMAGES — all five real. Chosen from the Tunnel build on the Mac
  (CLICKUP-ASSET-SWEEP/the-tunnel, 8,313 items, read 2026-09-17). Addresses are
  built from the file name: the dxassets image host, plus Photos/ and the file
  name, with + # & encoded. Vendor Assets is the shared tier and is usable on
  Soccer.com. No WorldSoccerShop asset is used anywhere here.

  RIGHTS: everything in the Tunnel is approved for photography use
  (Sacha, 2026-09-17). Named players need no separate check, so frames were
  picked on quality rather than on avoiding a face.

    England ..... 3:4  Cole Palmer, 2026 player frame
    Peru ........ 3:4  federation 2D, the only portrait Peru frame in the Tunnel

    Mexico ...... 3:4  26/27 away, fans

  photography at all: Wales has one Vendor Assets item and it is a thumbnail,
  and all seven South Africa items are tagged WorldSoccerShop. Rather than ship
  two grey panels, England and Mexico take their places. Both are live on
  Soccer.com and both have deep coverage in the Tunnel. Swap them for any other
  nation freely; the only requirement is a live team page and a portrait frame.

  3:4, 4:5, 2:3 or 9:16. Never square, never landscape. A 1:1 or 16:9 frame

/* ── Scoped reset ─────────────────────────────────────────────────────── */
.sdc-team-accordion,
.sdc-team-accordion *,
.sdc-team-accordion *::before,
.sdc-team-accordion *::after {
  box-sizing: border-box;
}

/* ── BASE LAYER — production theme tokens, fallbacks are for preview only ── */
.sdc-team-accordion {
  font-family: var(--sdc-ta-font);
  color: var(--theme-text-body, #27272A);
  background: var(--theme-bg-page, #FFFFFF);

  /* ── COMPONENT LAYER — renamed from --campaign-* at Fable's review ── */
  --sdc-ta-font: Figtree, 'Segoe UI', system-ui, sans-serif;
  --sdc-ta-panel-h: 620px;
  --sdc-ta-panel-expand: 2.2;
  --sdc-ta-scrim-floor: rgba(0, 0, 0, 0.85);
  --sdc-ta-scrim-mid: rgba(0, 0, 0, 0.72);
  --sdc-ta-scrim-top: rgba(0, 0, 0, 0);
  --sdc-ta-motion-base: 0.4s;
  --sdc-ta-motion-ease: cubic-bezier(0.32, 0.72, 0, 1);

  /* Osmo Button 009 API — see DEVIATION 1 */
  --button-009-color: var(--theme-text-body, #27272A);
  --button-009-color-background: var(--theme-bg-page, #FFFFFF);
  --button-009-color-focus: var(--theme-text-oninvert, #FFFFFF);
  --button-009-border-radius: 0;
  --button-009-icon-size: 1.2143em;
  --button-009-padding-top: 0.8571em;
  --button-009-padding-right: 1.1429em;
  --button-009-padding-bottom: 0.8571em;
  --button-009-padding-left: 1.1429em;
  --button-009-gap: 0.5714em;
  --button-009-overflow: clip;
  --button-009-focus-inset: -0.125em;
  --button-009-click-scale: 0.955 0.925;
  --button-009-ease-hover: cubic-bezier(0.32, 0.72, 0, 1);
  --button-009-ease-click: cubic-bezier(0.4, 0, 0.2, 1);
  --button-009-ease-focus: cubic-bezier(0.32, 0.72, 0, 1);

  --sdc-cta-size: 14px;
  --sdc-cta-weight: 600;
  --sdc-cta-line: 1.0714;
  --sdc-cta-line-em: 1.0714em;
  --sdc-cta-tracking: 0.08em;
  --sdc-cta-arrow-size: 1.5714em;
  --sdc-cta-arrow-tracking: 0.02em;
}

.sdc-team-accordion__title {
  margin: 0 0 20px;
  padding: 0 20px;
  font-size: clamp(22px, 2vw, 30px);
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: -0.01em;
  color: var(--theme-text-body, #27272A);
}

/* ── Panel row ────────────────────────────────────────────────────────── */
.sdc-team-accordion__row {
  display: flex;
  width: 100%;
  height: var(--sdc-ta-panel-h);
  margin: 0;
  padding: 0;
  list-style: none;
  overflow: hidden;
}

.sdc-team-accordion__item {
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  transition: flex-grow var(--sdc-ta-motion-base) var(--sdc-ta-motion-ease);
}

.sdc-team-accordion__panel {
  position: relative;
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  display: block;
  text-decoration: none;
}

/* The focus ring is a pseudo-element, not an outline: the panel image is an
   absolutely positioned child and paints over the parent's outline. */
.sdc-team-accordion__panel:focus-visible { outline: none; }

.sdc-team-accordion__panel::after {
  content: '';
  position: absolute;
  inset: 6px;
  z-index: 3;
  pointer-events: none;
  border: 3px solid var(--theme-text-oninvert, #FFFFFF);
  box-shadow: 0 0 0 3px var(--theme-bg-primary-normal, #27272A);
  opacity: 0;
}

.sdc-team-accordion__panel:focus-visible::after { opacity: 1; }

.sdc-team-accordion__image {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center top;
  transform-origin: center top;
  background: var(--theme-bg-subtle, #F5F5F5);
  /* If a photo 404s, the panel falls back to a clean grey rather than showing
     the alt text across the artwork. The alt attribute is untouched, so screen
     readers still read it. Bucket filenames fail silently, so this matters. */
  color: transparent;
  font-size: 0;
  transition: transform var(--sdc-ta-motion-base) var(--sdc-ta-motion-ease);
}

.sdc-team-accordion__scrim {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to top,
    var(--sdc-ta-scrim-floor) 0%,
    var(--sdc-ta-scrim-mid) 22%,
    var(--sdc-ta-scrim-top) 72%
  );
  pointer-events: none;
}

.sdc-team-accordion__content {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  padding: 32px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 16px;
}

.sdc-team-accordion__name {
  font-size: clamp(20px, 2.2vw, 28px);
  font-weight: 700;
  line-height: 1.1;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  text-wrap: balance;
  color: var(--theme-text-oninvert, #FFFFFF);
}

/* CTA rests hidden on fine pointers only, and returns on hover OR focus */
@media (hover: hover) and (pointer: fine) {
  .sdc-team-accordion__item:hover,
  .sdc-team-accordion__item:focus-within {
    flex-grow: var(--sdc-ta-panel-expand);
  }

  .sdc-team-accordion__panel:hover .sdc-team-accordion__image,
  .sdc-team-accordion__panel:focus-within .sdc-team-accordion__image {
    transform: scale(1.06);
  }

  .sdc-team-accordion__cta {
    opacity: 0;
    transform: translateY(12px);
    transition:
      opacity var(--sdc-ta-motion-base) var(--sdc-ta-motion-ease),
      transform var(--sdc-ta-motion-base) var(--sdc-ta-motion-ease);
  }

  .sdc-team-accordion__panel:hover .sdc-team-accordion__cta,
  .sdc-team-accordion__panel:focus-within .sdc-team-accordion__cta,
  .sdc-team-accordion__panel:focus-visible .sdc-team-accordion__cta {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ── Tablet ───────────────────────────────────────────────────────────── */
@media (max-width: 1023px) {
  .sdc-team-accordion { --sdc-ta-panel-h: 560px; }
  .sdc-team-accordion__content { padding: 24px; }
}

/* ── Phone: swipe rail ────────────────────────────────────────────────── */
@media (max-width: 767px) {
  .sdc-team-accordion { --sdc-ta-panel-h: 480px; }

  .sdc-team-accordion__title {
    padding: 0 16px;
    margin-bottom: 16px;
  }

  .sdc-team-accordion__row {
    gap: 12px;
    padding-left: 16px;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    scroll-padding-left: 16px;
    touch-action: pan-x pan-y pinch-zoom;
    overscroll-behavior-x: contain;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }

  .sdc-team-accordion__row::-webkit-scrollbar { display: none; }

  .sdc-team-accordion__item {
    flex: 0 0 82%;
    scroll-snap-align: center;
  }

  .sdc-team-accordion__item:last-child { margin-right: 16px; }

  .sdc-team-accordion__panel { border-radius: 4px; }

  .sdc-team-accordion__content { padding: 24px 20px; }

  .sdc-team-accordion__name { font-size: 24px; }
}

/* ── Reduced motion: everything stops, nothing is hidden ──────────────── */
@media (prefers-reduced-motion: reduce) {
  .sdc-team-accordion__item,
  .sdc-team-accordion__image,
  .sdc-team-accordion__cta {
    transition: none;
  }
  .sdc-team-accordion__cta {
    opacity: 1;
    transform: none;
  }
  .sdc-team-accordion__panel:hover .sdc-team-accordion__image,
  .sdc-team-accordion__panel:focus-within .sdc-team-accordion__image {
    transform: none;
  }
}

/* ═══ OSMO BUTTON 009 — from cta-canon.css, scoped (DEVIATION 2) ════════ */

  position: relative;

}
.sdc-team-accordion .button-009__bg {

  height: 100%;
  padding: 0;
}

  .sdc-team-accordion [data-hover]:is(:hover, :focus-visible) .button-009 .button-009__icon.is--right {
    translate: 1.5em 0 0;
    opacity: 0;
    transition: translate 0.5s 0.05s var(--button-009-ease-hover), opacity 0.15s 0.075s ease-out;
  }
}
/* ═══ END OSMO ═════════════════════════════════════════════════════════ */

}
</style>
