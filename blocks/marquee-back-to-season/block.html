<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marquee — canon v2 shell</title>
<!--
  SHELL-marquee-v2.html — MARQUEE chassis master (canon v2)
  Engine: Osmo Supply "CSS Marquee". Classes, both data- attributes, the
  keyframe and the JS are Osmo's. Spec + the 3 deliberate changes are
  documented in css/marquee-canon.css. PROPOSED, not locked.

  Design: Figma WorldSoccerShop - Site Updates, node 35:886
  (its own annotation now reads "Osmo marquee (large)").
  Intended placement: directly above the C-13 New Arrivals wall.

  HEIGHT BUDGET / EMBED SNIPPET
  <style>
    .wss-mq{width:100%;border:0;display:block;height:110px}
    @media (min-width:640px){.wss-mq{height:160px}}
    @media (min-width:1024px){.wss-mq{height:220px}}
  </style>
  <iframe class="wss-mq" loading="lazy" src="URL" title="Back to season"></iframe>

  ⚠️ BACKGROUND IMAGE is --marquee-bg, set inline below, so the generator fills
  it from data (rule D4) instead of the URL being baked into markup. Until the
  real S3 file exists this shell renders a CSS placeholder texture. Swap the one
  --marquee-bg line and nothing else changes.

  ⚠️ NO LINKS in this design, so no click beacon is needed yet. If a marquee item
  ever becomes a link, run tools/add_click_beacon.py (rules D2) and keep UTMs off.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;600;700&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/marquee-canon.css">
<style>
  /* PLACEHOLDER GROUND ONLY — delete when the real S3 image lands.
     Approximates the dark speckled texture so the scrim and contrast can be
     judged. It is NOT the artwork. */
  .mq-wrap__bg.is--placeholder{
    background-color:#131313;
    background-image:
      radial-gradient(1px 1px at 12% 28%, rgba(255,255,255,.55), transparent 100%),
      radial-gradient(1px 1px at 31% 71%, rgba(255,255,255,.40), transparent 100%),
      radial-gradient(1.5px 1.5px at 47% 19%, rgba(255,255,255,.60), transparent 100%),
      radial-gradient(1px 1px at 63% 58%, rgba(255,255,255,.35), transparent 100%),
      radial-gradient(1px 1px at 78% 33%, rgba(255,255,255,.50), transparent 100%),
      radial-gradient(1.5px 1.5px at 88% 77%, rgba(255,255,255,.45), transparent 100%),
      radial-gradient(1px 1px at 22% 88%, rgba(255,255,255,.30), transparent 100%),
      radial-gradient(1px 1px at 55% 91%, rgba(255,255,255,.40), transparent 100%),
      linear-gradient(107deg, #1b1b1b 0%, #0d0d0d 42%, #1f1f1f 68%, #0a0a0a 100%);
    background-size:auto,auto,auto,auto,auto,auto,auto,auto,cover;
  }
</style>
</head>
<body>

<!-- data-marquee sets the role. Swap data-marquee to "small" and/or data-theme to "white". Four variants total, see marquee-reference.html. -->
<div class="mq-wrap" data-marquee="large" data-theme="black"
     style="--marquee-bg:none"><!-- generator writes: url('https://www.imagehandler.net/dxassets/?img=WSS/<file>.jpg&w=2912') -->

  <div class="mq-wrap__bg is--placeholder" aria-hidden="true"></div>
  <div class="mq-wrap__scrim" aria-hidden="true"></div>

  <div data-css-marquee class="marquee-css" role="marquee" aria-label="Back to season. Fresh kits.">
    <div data-css-marquee-list class="marquee-css__list">

      <div class="marquee-css__item">
        <p class="marquee-css__item-p is--kits">Fresh Kits</p>
        <span class="marquee-css__item-svg" role="img" aria-label="fire">&#128293;</span>
      </div>
      <div class="marquee-css__item">
        <p class="marquee-css__item-p is--sub">back to season</p>
        <span class="marquee-css__item-svg" role="img" aria-label="fire">&#128293;</span>
      </div>
      <div class="marquee-css__item">
        <p class="marquee-css__item-p is--kits">Fresh Kits</p>
        <span class="marquee-css__item-svg" role="img" aria-label="fire">&#128293;</span>
      </div>
      <div class="marquee-css__item">
        <p class="marquee-css__item-p is--sub">back to season</p>
        <span class="marquee-css__item-svg" role="img" aria-label="fire">&#128293;</span>
      </div>

    </div>
  </div>
</div>

<script src="js/marquee-init.js"></script>

</body>
</html>
