  Reserved heights: Mobile 343 · 640px and up 470 · 1024px and up 547
  Swap per use: each project's cover, its gallery photos, title, eyebrow and label. Photos come from the image handler as JPG with width and height set.
  Brand skins: set data-skin on the wrapper to docs, sdc (Soccer.com), wss (WorldSoccerShop) or 431 (431 Sports), and swap the font line below for that brand's line:
    sdc  https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap
    wss  https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600&family=Inter:wght@400;500&display=swap

  More than one on a page: give each wrapper its own id and use that id in the style block.
-->

}

/* ⚠️DEVIATION 1: every Osmo selector below is prefixed with the doubled wrapper id; store styles on Soccer.com, WorldSoccerShop and 431 cannot reach the .showcase-slider__ classes */
/* ⚠️DEVIATION 2: min-height:100svh, 75vw and 90vw are replaced by fixed pixel slots and a fixed height per breakpoint; aspect-ratio on both frames is replaced by a fixed pixel height at the design ratio 365:230 */
/* ⚠️DEVIATION 3: type, colour, the 8px card gap and the label pill follow the design frame through the skin layer above; the muted label and eyebrow use a solid colour at full opacity so they pass contrast */

#sei-showcase-slider#sei-showcase-slider {
  --showcase-slider-slot: 292px; /* ⚠️DEVIATION 2 */
  --showcase-slider-gap: 16px; /* ⚠️DEVIATION 2 */
  --showcase-slider-grow: 1.7;
  --showcase-slider-viewer-slot: 351px; /* ⚠️DEVIATION 2 */
  display: flex;
  flex-direction: column;
  gap: 2em;
  width: 100%;
  height: var(--sss-height); /* ⚠️DEVIATION 2 */
  padding-top: 2em;
  padding-bottom: 2em;
  overflow: hidden;
  overscroll-behavior-x: contain;
  user-select: none;
  background: var(--sss-surface); /* ⚠️DEVIATION 3 */
  color: var(--sss-ink); /* ⚠️DEVIATION 3 */
  font: 400 16px/1.2 var(--sss-body-face); /* ⚠️DEVIATION 3 */
  -webkit-font-smoothing: antialiased;
  text-align: left;
}

#sei-showcase-slider#sei-showcase-slider .showcase-slider__stage {
  display: grid;
  flex-grow: 1;
  grid-template-columns: minmax(0, 1fr);
  align-content: center;
}

#sei-showcase-slider#sei-showcase-slider .showcase-slider__collection {

  grid-column-start: 1;
  align-self: center;
}

#sei-showcase-slider#sei-showcase-slider[data-showcase-slider-status="open"] .showcase-slider__collection {
  pointer-events: none;
}

#sei-showcase-slider#sei-showcase-slider .showcase-slider__list {
  display: flex;
  overflow: hidden;
  padding-left: calc(50% - var(--showcase-slider-slot) / 2);
  touch-action: pan-y;
}

#sei-showcase-slider#sei-showcase-slider .showcase-slider__item {
  flex: 0 0 var(--showcase-slider-slot);
  padding-left: calc(var(--showcase-slider-gap) / 2);
  padding-right: calc(var(--showcase-slider-gap) / 2);
}

#sei-showcase-slider#sei-showcase-slider .showcase-slider__card {
  display: flex;
  flex-direction: column;
  gap: 8px; /* ⚠️DEVIATION 3 */
  width: 100%;
  padding: 0;
  border-style: none;
  background-color: transparent;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
}

#sei-showcase-slider#sei-showcase-slider .showcase-slider__card:focus-visible {
  outline: 2px solid currentColor;
  outline-offset: 0.25em;
}

#sei-showcase-slider#sei-showcase-slider .showcase-slider__frame {
  position: relative;
  display: block;
  width: 100%;
  height: var(--sss-frame-h); /* ⚠️DEVIATION 2 */
  overflow: hidden;
  border-radius: 0.25em;
  background-color: var(--sss-frame); /* ⚠️DEVIATION 3 */
}

#sei-showcase-slider#sei-showcase-slider .showcase-slider__image {

  left: -10%;
  width: 120%;
  max-width: none;
  height: 100%;
  object-fit: cover;
  pointer-events: none;
}

#sei-showcase-slider#sei-showcase-slider .showcase-slider__chip {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px 20px;
  border-radius: 999px;
  background: var(--sss-chip-bg);
  color: var(--sss-chip-ink);
  font: 500 var(--sss-chip-size)/1 var(--sss-body-face);
  letter-spacing: var(--sss-chip-track);
  white-space: nowrap;
}

#sei-showcase-slider#sei-showcase-slider .showcase-slider__info {
  display: flex;
  justify-content: space-between;
  align-items: center; /* ⚠️DEVIATION 3 */

#sei-showcase-slider#sei-showcase-slider .showcase-slider__title {

  letter-spacing: var(--sss-title-track); /* ⚠️DEVIATION 3 */

}

#sei-showcase-slider#sei-showcase-slider .showcase-slider__meta {

  letter-spacing: var(--sss-eyebrow-track); /* ⚠️DEVIATION 3 */
  text-transform: uppercase; /* ⚠️DEVIATION 3 */

}

#sei-showcase-slider#sei-showcase-slider .showcase-slider__gallery-collection {

}

#sei-showcase-slider#sei-showcase-slider .showcase-slider__viewer {

  grid-column-start: 1;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  pointer-events: none;
}

#sei-showcase-slider#sei-showcase-slider[data-showcase-slider-status="open"] .showcase-slider__viewer {

#sei-showcase-slider#sei-showcase-slider .showcase-slider__viewer-list {

  grid-column-start: 1;
  display: flex;
  overflow: hidden;

  visibility: hidden;
  touch-action: pan-y;
}

#sei-showcase-slider#sei-showcase-slider[data-showcase-slider-status="open"] .showcase-slider__viewer-list[data-showcase-slider-status="active"] {

#sei-showcase-slider#sei-showcase-slider .showcase-slider__viewer-item {

}

#sei-showcase-slider#sei-showcase-slider .showcase-slider__viewer-frame {

  width: 100%;

#sei-showcase-slider#sei-showcase-slider .showcase-slider__viewer-image {

  width: 120%;

#sei-showcase-slider#sei-showcase-slider .showcase-slider__controls {

#sei-showcase-slider#sei-showcase-slider .showcase-slider__bar {

  font-size: 0.875em;
  line-height: 1.286;
}

#sei-showcase-slider#sei-showcase-slider .showcase-slider__viewer-bar {

#sei-showcase-slider#sei-showcase-slider .showcase-slider__label {

}

#sei-showcase-slider#sei-showcase-slider .showcase-slider__arrows {

}

#sei-showcase-slider#sei-showcase-slider .showcase-slider__arrow {

@media (min-width: 640px) {

}

      <p class="showcase-slider__count"><span data-showcase-slider-index>01</span><span> / </span><span data-showcase-slider-total>06</span></p>
    </div>
    <div data-showcase-slider-viewer-bar inert class="showcase-slider__viewer-bar">
      <div class="showcase-slider__crumb">
        <button data-showcase-slider-close type="button" class="showcase-slider__back">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true" class="showcase-slider__icon"><path d="M10 3L5 8L10 13" stroke="currentColor" stroke-width="1.5"></path></svg>
          <span>All projects</span>
        </button>
        <span aria-hidden="true" class="showcase-slider__divider">/</span>
        <span data-showcase-slider-slot="title" class="showcase-slider__crumb-title"></span>
      </div>
      <div class="showcase-slider__actions">
        <p class="showcase-slider__count"><span data-showcase-slider-index>01</span><span> / </span><span data-showcase-slider-total>04</span></p>
        <div class="showcase-slider__arrows">
          <button data-showcase-slider-prev type="button" aria-label="Previous image" class="showcase-slider__arrow">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true" class="showcase-slider__icon"><path d="M10 3L5 8L10 13" stroke="currentColor" stroke-width="1.5"></path></svg>
          </button>
          <button data-showcase-slider-next type="button" aria-label="Next image" class="showcase-slider__arrow">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true" class="showcase-slider__icon"><path d="M6 3L11 8L6 13" stroke="currentColor" stroke-width="1.5"></path></svg>

<script>
(function () {
  function initShowcaseSlider() {
    let reduceMotion = false;
    gsap.matchMedia().add("(prefers-reduced-motion: reduce)", () => {
      reduceMotion = true;
      return () => {
        reduceMotion = false;
      };
    });

    document.querySelectorAll("[data-showcase-slider-init]").forEach((root) => {
      // ⚠️DEVIATION 5: each wrapper starts once, even when two pasted copies run this script
      if (root.hasAttribute("data-showcase-slider-live")) return;
      root.setAttribute("data-showcase-slider-live", "");

      const parallaxStrength = 8; // % of the image width it shifts at the edge of the slider

      const collection = root.querySelector("[data-showcase-slider-collection]");
      const list = root.querySelector("[data-showcase-slider-list]");
      const items = [...list.querySelectorAll("[data-showcase-slider-item]")];
      const cards = items.map((item) => item.querySelector("[data-showcase-slider-open]"));
      const frames = items.map((item) => item.querySelector("[data-showcase-slider-frame]"));
      const images = items.map((item) => item.querySelector("[data-showcase-slider-image]"));
      const infos = items.map((item) => item.querySelector("[data-showcase-slider-info]"));
      const viewer = root.querySelector("[data-showcase-slider-viewer]");
      const viewerTemplate = viewer.querySelector("[data-showcase-slider-viewer-list]");
      const viewerItemTemplate = viewerTemplate.querySelector("[data-showcase-slider-viewer-item]");
      const bar = root.querySelector("[data-showcase-slider-bar]");
      const viewerBar = root.querySelector("[data-showcase-slider-viewer-bar]");
      const slots = [...root.querySelectorAll("[data-showcase-slider-slot]")];
      const closeButton = root.querySelector("[data-showcase-slider-close]");
      const prevButton = root.querySelector("[data-showcase-slider-prev]");
      const nextButton = root.querySelector("[data-showcase-slider-next]");
      const setText = (scope, hook, value) => {
        const element = scope.querySelector(`[data-showcase-slider-${hook}]`);
        if (element) element.textContent = String(value).padStart(2, "0");
      };

      const count = items.length;
      const projects = [];
      let active = null;
      let activeIndex = -1;
      let isOpen = false;
      let busy = false;
      let openedByKeyboard = false;
      let pointerStartX = 0;

      const centerX = (element) => element.getBoundingClientRect().left + element.offsetWidth / 2;
      const offset = (from, to) => {
        const a = from.getBoundingClientRect();
        const b = to.getBoundingClientRect();
        return { x: a.x - b.x + (a.width - b.width) / 2, y: a.y - b.y + (a.height - b.height) / 2, scale: a.width / b.width };
      };
      const matchInput = (slider) => {
        const slideWidth = slider.viewport.itemWidth || 1;
        slider.config.dragSensitivity = 1 / slideWidth;
        slider.config.scrollSensitivity = 2000 / slideWidth;
      };
      const wasDrag = (event) => event.detail !== 0 && Math.abs(event.clientX - pointerStartX) > 6;

      const createTrack = (slider, trackImages, loop) => ({
        slider,
        loop,
        setters: trackImages.map((image) => gsap.quickSetter(image, "xPercent")),
      });

      const renderParallax = (track) => {
        const { slider } = track;
        const ratio = slider.viewport.itemWidth / (slider.viewport.wrapperWidth / 2 || 1);
        const strength = reduceMotion ? 0 : parallaxStrength;
        track.setters.forEach((setX, index) => {
          const position = track.loop ? gsap.utils.wrap(-count / 2, count / 2, index + slider.current) : index + slider.current;
          setX(-position * ratio * strength);
        });
      };

      const base = new Smooothy(list, {
        infinite: true,
        snap: true,
        onResize: matchInput,
        onSlideChange: (current) => setText(bar, "index", current + 1),
      });
      const baseTrack = createTrack(base, images, true);
      setText(bar, "total", count);

      const updateViewer = (current) => {
        setText(viewerBar, "index", current + 1);
        prevButton.disabled = current === 0;
        nextButton.disabled = current === active.frames.length - 1;
      };

      const buildProject = (index) => {
        if (projects[index]) return projects[index];

        const sources = [images[index], ...items[index].querySelectorAll("[data-showcase-slider-slide]")];
        const viewerList = viewerTemplate.cloneNode(false);
        viewerList.setAttribute("data-showcase-slider-status", "active");
        viewer.appendChild(viewerList);

        const viewerFrames = [];
        const viewerImages = [];
        sources.forEach((source, sourceIndex) => {
          const viewerItem = viewerItemTemplate.cloneNode(true);
          const viewerFrame = viewerItem.querySelector("[data-showcase-slider-viewer-frame]");
          const viewerImage = viewerItem.querySelector("[data-showcase-slider-viewer-image]");
          ["src", "srcset", "sizes", "alt"].forEach((attribute) => {
            if (source.hasAttribute(attribute)) viewerImage.setAttribute(attribute, source.getAttribute(attribute));
            else viewerImage.removeAttribute(attribute);
          });
          viewerItem.setAttribute("aria-label", `${sourceIndex + 1} of ${sources.length}`);
          viewerFrame.addEventListener("click", (event) => {
            if (!wasDrag(event) && !busy) projects[index].slider.target = -sourceIndex;
          });
          viewerList.appendChild(viewerItem);
          viewerFrames.push(viewerFrame);
          viewerImages.push(viewerImage);
        });

        const slider = new Smooothy(viewerList, {
          infinite: false,
          snap: true,
          onResize: matchInput,
          onSlideChange: (current) => updateViewer(current),
        });
        viewerList.addEventListener("scroll", () => {
          viewerList.scrollLeft = 0;
        });

        projects[index] = {
          list: viewerList,
          slider,
          frames: viewerFrames,
          images: viewerImages,
          track: createTrack(slider, viewerImages, false),
        };
        return projects[index];
      };

      const setOpen = (open) => {
        isOpen = open;
        root.setAttribute("data-showcase-slider-status", open ? "open" : "closed");
        collection.inert = open;
        viewer.inert = !open;
        viewerBar.inert = !open;
        base.paused = open;
      };

      const open = (index, fromKeyboard) => {
        if (busy || isOpen) return;
        busy = true;
        activeIndex = index;
        openedByKeyboard = fromKeyboard;
        base.target = base.current;
        projects.forEach((project) => project.list.removeAttribute("data-showcase-slider-status"));
        active = buildProject(index);
        active.list.setAttribute("data-showcase-slider-status", "active");
        setOpen(true);

        active.slider.current = active.slider.target = 0;
        active.slider.paused = false;
        active.slider.resize();
        renderParallax(active.track);
        updateViewer(0);
        setText(viewerBar, "total", active.frames.length);
        slots.forEach((slot) => {
          const content = items[index].querySelector(`[data-showcase-slider-content="${slot.getAttribute("data-showcase-slider-slot")}"]`);
          slot.replaceChildren(...(content ? content.cloneNode(true).childNodes : []));
        });

        const move = offset(frames[index], active.frames[0]);
        const push = root.offsetWidth * 0.35;
        const tl = gsap.timeline({
          defaults: {
            ease: "expo.inOut",
          },
          onComplete: () => {
            busy = false;
          },
        });

        tl.set(frames[index], {
          autoAlpha: 0,
        })
        .fromTo(active.frames[0], {
          x: move.x,
          y: move.y,
          scale: move.scale,
        }, {
          x: 0,
          y: 0,
          scale: 1,
          duration: 1.1,
        })
        .fromTo(active.images[0], {
          xPercent: gsap.getProperty(images[index], "xPercent"),
        }, {
          xPercent: gsap.getProperty(active.images[0], "xPercent"),
          duration: 1.1,
        }, "<")
        .to(cards.filter((card, cardIndex) => cardIndex !== index), {
          x: (cardIndex, card) => Math.sign(centerX(card) - centerX(cards[index])) * push,
          autoAlpha: 0,
          duration: 1,
        }, "<")
        .to([infos[index], bar], {
          autoAlpha: 0,
          duration: 0.3,
          ease: "power1.out",
        }, "<")
        .fromTo(active.frames.slice(1), {
          x: push * 0.6,
          autoAlpha: 0,
        }, {
          x: 0,
          autoAlpha: 1,
          duration: 1,
          ease: "expo.out",
          stagger: 0.05,
        }, "<+=0.6")
        .fromTo([viewerBar, ...slots], {
          autoAlpha: 0,
        }, {
          autoAlpha: 1,
          duration: 0.5,
          ease: "power1.out",
        }, "<");
        if (fromKeyboard) tl.call(() => closeButton.focus({ preventScroll: true }), null, 0.65);
        if (reduceMotion) tl.progress(1);
      };

      const close = () => {
        if (busy || !isOpen) return;
        busy = true;
        const current = active.slider.currentSlide;
        const frame = active.frames[current];
        const keyboardInside = root.contains(document.activeElement) && document.activeElement.matches(":focus-visible");
        const move = offset(frames[activeIndex], frame);
        const push = root.offsetWidth * 0.35;

        const tl = gsap.timeline({
          defaults: {
            ease: "expo.inOut",
          },
          onComplete: () => {
            gsap.set([...active.frames, ...cards], {
              clearProps: "transform,opacity,visibility",
            });
            active.slider.paused = true;
            setOpen(false);
            busy = false;
            if (openedByKeyboard || keyboardInside) cards[activeIndex].focus({ preventScroll: true });
          },
        });

        tl.to(frame, {
          x: `+=${move.x}`,
          y: `+=${move.y}`,
          scale: move.scale,
          duration: 1.1,
        })
        .to(active.images[current], {
          xPercent: gsap.getProperty(images[activeIndex], "xPercent"),
          duration: 1.1,
        }, "<")
        .to(active.frames.filter((other) => other !== frame), {
          x: (frameIndex, other) => Math.sign(centerX(other) - centerX(frame)) * push * 0.6,
          autoAlpha: 0,
          duration: 0.6,
          ease: "power3.in",
        }, "<")
        .to([viewerBar, ...slots], {
          autoAlpha: 0,
          duration: 0.3,
          ease: "power1.out",
        }, "<")
        .to(cards.filter((card, cardIndex) => cardIndex !== activeIndex), {
          x: 0,
          autoAlpha: 1,
          duration: 1,
        }, "<+=0.1")
        .to([infos[activeIndex], bar], {
          autoAlpha: 1,
          duration: 0.5,
          ease: "power1.out",
        }, 0.8)
        .set(frames[activeIndex], {
          autoAlpha: 1,
        }, "<")
        .to(frame, {
          autoAlpha: 0,
          duration: 0.3,
          ease: "power1.out",
        }, "<");
        if (reduceMotion) tl.progress(1);
      };

      root.addEventListener("pointerdown", (event) => {
        pointerStartX = event.clientX;
      }, true);

      cards.forEach((card, index) => {
        card.addEventListener("click", (event) => {
          if (!wasDrag(event)) open(index, event.detail === 0);
        });
        card.addEventListener("focus", () => {
          if (isOpen || !card.matches(":focus-visible")) return;
          base.target = -index + count * Math.round((base.target + index) / count);
        });
      });

      list.addEventListener("scroll", () => {
        list.scrollLeft = 0;
      });
      closeButton.addEventListener("click", close);
      prevButton.addEventListener("click", () => active.slider.goToPrev());
      nextButton.addEventListener("click", () => active.slider.goToNext());

      document.addEventListener("keydown", (event) => {
        if (isOpen) {
          if (event.key === "Escape") close();
          if (event.key === "ArrowRight") nextButton.click();
          if (event.key === "ArrowLeft") prevButton.click();
        }
      });

      gsap.ticker.add(() => {
        if (!isOpen) {
          base.update();
          renderParallax(baseTrack);
        }
        if (isOpen && !busy) {
          active.slider.update();
          renderParallax(active.track);
        }
      });
    });
  }

  // ⚠️DEVIATION 6: GSAP and Smooothy are pinned to exact versions and loaded here; the slider starts only when both have landed
  function load(src, ready, done) {
    if (ready()) return done();
    var s = document.createElement("script");
    s.src = src; s.async = false; s.onload = done; s.onerror = done;
    document.head.appendChild(s);
  }

  function start() {
    if (typeof window.gsap === "undefined" || typeof window.Smooothy === "undefined") return;
    try {
      initShowcaseSlider();
    } catch (e) {
      document.querySelectorAll("[data-showcase-slider-init]").forEach(function (root) { root.removeAttribute("data-showcase-slider-live"); });
      if (window.console) console.warn("Showcase Slider:", e);
    }
  }

  function boot() {
    load("https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js", function () { return typeof window.gsap !== "undefined"; }, function () {
      if (typeof window.gsap === "undefined") return;
      load("https://cdn.jsdelivr.net/npm/smooothy@0.0.35/dist/smooothy.min.js", function () { return typeof window.Smooothy !== "undefined"; }, start);
    });
  }

  // ⚠️DEVIATION 7: started at once when the page has already loaded, because a Fastr component arrives after DOMContentLoaded
  if (document.readyState !== "loading") boot();
  else document.addEventListener("DOMContentLoaded", boot);
})();
</script>
