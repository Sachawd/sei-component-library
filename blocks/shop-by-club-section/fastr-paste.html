<!-- Shop by Club section: background photo, search for any club or player. WorldSoccerShop. Club search header (C-17).
     Fastr CMS paste: one HTML widget, direct embed, no iframe.
     Reserved heights: Mobile 340 / 640px and up 380 / 1024px and up 412.
     Every rule is scoped to .c17 and cannot reach the page.
     Background photo: set --hero-img at the top of the style block to url("https://...jpg"). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>

.c17{
  --hero-img: none;
  --hero-bg: #14181c;
  --ink:#0d1114;
  --paper:#fff;
  --line:rgba(255,255,255,.24);
  --accent:#0d1114;
  --radius:6px;
  --pad:24px;
  --title:"SHOP BY CLUB";
}

.c17,.c17 *,.c17 *::before,.c17 *::after{margin:0;padding:0;box-sizing:border-box}
.c17{position:relative;width:100%;height:412px;overflow:hidden;background:var(--hero-bg);
  font-family:"Chakra Petch",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;text-align:left;}
.c17__bg{position:absolute;inset:0;background:var(--hero-img) center/cover no-repeat,
  linear-gradient(115deg,#1b2229 0%,#2b343d 45%,#151a1f 100%);}
.c17__scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.30),rgba(0,0,0,.55));}
.c17__inner{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;
  padding:0 var(--pad);max-width:1456px;margin:0 auto;transition:padding .18s ease,justify-content 0s}

.c17.is-open .c17__inner{justify-content:flex-start;padding-top:18px}
.c17__eyebrow,.c17__rule{transition:opacity .14s ease,max-height .18s ease,margin .18s ease}
.c17.is-open .c17__eyebrow,.c17.is-open .c17__rule{opacity:0;max-height:0;margin:0;overflow:hidden}
.c17__h1{transition:font-size .18s ease,margin .18s ease}
.c17.is-open .c17__h1{margin:0 0 12px}

.c17__eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.72);font-weight:600}
.c17__h1{font-size:clamp(30px,5.4vw,54px);line-height:.98;letter-spacing:-.01em;text-transform:uppercase;
  font-weight:700;color:#fff;margin:8px 0 4px}
.c17__rule{width:76px;height:4px;background:#fff;margin:14px 0 20px}

.c17__searchwrap{max-width:660px;width:100%;position:relative;display:none}
.c17.is-ready .c17__searchwrap{display:block}
.c17__field{display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:var(--radius);
  padding:0 16px;height:56px;box-shadow:0 10px 34px rgba(0,0,0,.28)}
.c17__mag{width:19px;height:19px;flex:none;opacity:.5}
.c17__input{flex:1;border:0;outline:0;font:600 16px/1 "Chakra Petch",sans-serif;color:var(--ink);background:transparent;min-width:0}
.c17__input::placeholder{color:#8a949d;font-weight:500}

.c17__input::-ms-clear{display:none}
.c17__clear{border:0;background:transparent;cursor:pointer;font-size:20px;line-height:1;color:#8a949d;
  padding:6px;display:none}
.c17.is-typing .c17__clear{display:block}

.c17__nojs{display:inline-block;margin-top:4px;color:#fff;font-weight:600;font-size:15px;
  border-bottom:2px solid rgba(255,255,255,.6);text-decoration:none;padding-bottom:2px}
.c17.is-ready .c17__nojs{display:none}

.c17__panel{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--paper);
  border-radius:var(--radius);box-shadow:0 20px 50px rgba(0,0,0,.34);overflow:hidden;display:none;z-index:5}
.c17.is-open .c17__panel{display:block}
.c17__scroll{max-height:var(--panelmax,190px);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.c17__kicker{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#939da6;font-weight:700;
  padding:11px 16px 6px;background:#fafbfb;border-bottom:1px solid #eef1f2}

.c17__row{display:flex;align-items:center;gap:13px;padding:11px 16px;text-decoration:none;color:var(--ink);
  border-bottom:1px solid #f0f2f3;cursor:pointer}
.c17__row:last-child{border-bottom:0}
.c17__row:hover,.c17__row.is-sel{background:#f4f6f7}
.c17__crest{width:34px;height:34px;flex:none;object-fit:contain}
.c17__crestph{width:34px;height:34px;flex:none;border-radius:50%;background:#eceff1}
.c17__t{flex:1;min-width:0}
.c17__t b{display:block;font-size:15px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c17__t em{display:block;font-style:normal;font-size:11.5px;color:#8a949d;margin-top:1px;font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c17__go{font-size:10.5px;font-weight:700;letter-spacing:.09em;color:#6f7a83;flex:none;text-transform:uppercase}

.c17__row--sub{padding-left:30px;position:relative}
.c17__row--sub::before{content:"";position:absolute;left:16px;top:13px;bottom:13px;width:3px;background:#e2e6e9;border-radius:2px}
.c17__doc{width:24px;height:30px;flex:none;border-radius:3px;background:#eceff1}

.c17__empty{padding:20px 16px}
.c17__empty b{display:block;font-size:15px;margin-bottom:3px}
.c17__empty span{display:block;font-size:13px;color:#8a949d;margin-bottom:13px}
.c17__cta{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-size:12.5px;
  font-weight:700;letter-spacing:.05em;padding:11px 18px;border-radius:var(--radius);text-transform:uppercase}

@media (max-width:1023px){ .c17{--pad:20px;height:380px} .c17__field{height:52px} }
@media (max-width:639px){
  .c17{--pad:16px;height:340px}
  .c17__rule{margin:10px 0 14px;width:56px}
  .c17__field{height:48px;padding:0 13px}
  .c17__input{font-size:16px}
  .c17__crest,.c17__crestph{width:28px;height:28px}
  .c17__t b{font-size:14px}
  .c17.is-open .c17__h1{font-size:26px;margin:0 0 10px}
}
@media (prefers-reduced-motion:no-preference){
  .c17__panel{animation:c17in .16s ease-out}
  @keyframes c17in{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
}
</style>

<div class="c17" id="c17">
  <div class="c17__bg" aria-hidden="true"></div>
  <div class="c17__scrim" aria-hidden="true"></div>

  <div class="c17__inner">
    <div class="c17__eyebrow">World Soccer Shop</div>
    <h1 class="c17__h1">Shop by Club</h1>
    <div class="c17__rule" aria-hidden="true"></div>

    <a class="c17__nojs" href="https://www.worldsoccershop.com/shop/clubs" target="_top">Browse all clubs &rarr;</a>

    <div class="c17__searchwrap">
      <div class="c17__field">
        <svg class="c17__mag" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <circle cx="9" cy="9" r="6.4" stroke="currentColor" stroke-width="2"></circle>
          <path d="M13.8 13.8 18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
        </svg>
        <input class="c17__input" id="c17q" type="text" enterkeyhint="search" autocomplete="off" autocorrect="off"
               autocapitalize="off" spellcheck="false" placeholder="Search a club, try &ldquo;barca&rdquo;, &ldquo;rayados&rdquo;, &ldquo;spurs&rdquo;…"
               aria-label="Search for a club" aria-expanded="false" aria-controls="c17panel" role="combobox">
        <button class="c17__clear" id="c17x" type="button" aria-label="Clear search">&times;</button>
      </div>
      <div class="c17__panel" id="c17panel" role="listbox" aria-label="Club results">
        <div class="c17__scroll" id="c17scroll"></div>
      </div>
    </div>
  </div>
</div>

 1"]};
  var SRCH = "https://www.worldsoccershop.com/srch?query=";
  var BASE = "https://www.worldsoccershop.com/shop/clubs/";

  var root=document.getElementById("c17"), q=document.getElementById("c17q"),
      panel=document.getElementById("c17panel"), scroll=document.getElementById("c17scroll"),
      clearBtn=document.getElementById("c17x");
  if(!root||!q||!scroll) return;

  function fold(s){
    s=String(s||"").toLowerCase();
    try{ s=s.normalize("NFD").replace(/[̀-ͯ]/g,""); }catch(e){}
    return " "+s.replace(/[^a-z0-9]+/g," ").trim()+" ";
  }

  var CL=DATA.clubs||[], PL=DATA.players||[], TIFO=DATA.tifo||{};
  for(var i=0;i<CL.length;i++){
    var c=CL[i], hay=fold(c.n);
    for(var a=0;a<(c.a||[]).length;a++) hay+=fold(c.a[a]);
    c._h=hay; c._n=fold(c.n);
  }
  for(var p=0;p<PL.length;p++) PL[p]._h=fold(PL[p].n);

  function esc(s){return String(s).replace(/[&<>"']/g,function(m){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];});}

  function matchedAlias(c,t){
    for(var a=0;a<(c.a||[]).length;a++){ if((" "+fold(c.a[a]).trim()).indexOf(t)===0) return c.a[a]; }
    for(var b=0;b<(c.a||[]).length;b++){ if(fold(c.a[b]).indexOf(t)>-1) return c.a[b]; }
    return null;
  }

  function search(raw){
    var t=fold(raw).trim(); if(!t) return {clubs:[],players:[]};
    t=" "+t;
    var starts=[],inside=[],ppl=[];
    for(var i=0;i<CL.length;i++){
      var c=CL[i];
      if(c._n.indexOf(t)===0) starts.push(c);
      else if(c._h.indexOf(t)>-1) inside.push(c);
    }
    for(var j=0;j<PL.length&&ppl.length<4;j++) if(PL[j]._h.indexOf(t)>-1) ppl.push(PL[j]);

    return {clubs:starts.concat(inside).slice(0,8), players:ppl, term:t};
  }

  function crest(c){
    if(!c.c) return '<span class="c17__crestph" aria-hidden="true"></span>';
    return '<img class="c17__crest" src="'+esc(c.c)+'" alt="" width="34" height="34" '+
           'onerror="this.onerror=null;this.style.visibility=\'hidden\';">';
  }
  function clubRow(c,note){
    return '<a class="c17__row" role="option" target="_top" href="'+esc(BASE+c.s)+'">'+
      crest(c)+'<span class="c17__t"><b>'+esc(c.n)+'</b><em>'+esc(note||c.l)+'</em></span>'+
      '<span class="c17__go">Shop &rarr;</span></a>';
  }
  function tifoRows(c){
    var arts=TIFO[c.n]; if(!arts) return "";
    var out="";
    for(var i=0;i<arts.length;i++){
      out+='<a class="c17__row c17__row--sub" role="option" target="_top" href="'+esc(arts[i][1])+'">'+
        '<span class="c17__doc" aria-hidden="true"></span>'+
        '<span class="c17__t"><b>'+esc(arts[i][0])+'</b><em>From The Tifo</em></span>'+
        '<span class="c17__go">Read &rarr;</span></a>';
    }
    return out;
  }

  function render(raw){
    var html="", r=search(raw);
    if(!raw.trim()){
      html='<div class="c17__kicker">Most shopped</div>';
      for(var i=0;i<8&&i<CL.length;i++) html+=clubRow(CL[i]);
    } else if(r.clubs.length||r.players.length){
      if(r.clubs.length){
        html+='<div class="c17__kicker">'+(r.clubs.length===1?"Club":"Clubs")+'</div>';
        for(var k=0;k<r.clubs.length;k++){
          var c=r.clubs[k], al=matchedAlias(c,r.term);
          html+=clubRow(c, al? c.l+" · matched “"+al+"”" : c.l);
          if(k===0) html+=tifoRows(c);
        }
      }
      if(r.players.length){
        html+='<div class="c17__kicker">Players</div>';
        for(var m=0;m<r.players.length;m++){
          var pl=r.players[m];
          html+='<a class="c17__row" role="option" target="_top" href="'+esc(pl.u)+'">'+
            '<span class="c17__crestph" aria-hidden="true"></span>'+
            '<span class="c17__t"><b>'+esc(pl.n)+'</b><em>'+esc(pl.c)+'</em></span>'+
            '<span class="c17__go">Shop &rarr;</span></a>';
        }
      }
    } else {
      html='<div class="c17__empty"><b>No club page for &ldquo;'+esc(raw.trim())+'&rdquo; yet.</b>'+
        '<span>We may still stock them, so have a look.</span>'+
        '<a class="c17__cta" target="_top" href="'+esc(SRCH+encodeURIComponent(raw.trim()))+'">'+
        'Search the store &rarr;</a></div>'+
        '<div class="c17__kicker">Or jump to</div>';
      for(var z=0;z<4&&z<CL.length;z++) html+=clubRow(CL[z]);
    }
    scroll.innerHTML=html; sel=-1;
  }

  function fit(){
    var f=scroll.getBoundingClientRect(), b=root.getBoundingClientRect(), room=b.bottom-f.top-16;
    var h=Math.max(96,Math.min(340,room));
    scroll.style.maxHeight=h+"px";
  }
  function open(){
    if(root.classList.contains("is-open")){ fit(); return; }
    root.classList.add("is-open");
    q.setAttribute("aria-expanded","true");
    fit();
    requestAnimationFrame(fit);
    setTimeout(fit,200);
  }
  function close(){ root.classList.remove("is-open"); q.setAttribute("aria-expanded","false"); sel=-1; }

  var sel=-1;
  function rows(){ return scroll.querySelectorAll(".c17__row"); }
  function move(d){
    var r=rows(); if(!r.length)return;
    if(sel>-1&&r[sel]) r[sel].classList.remove("is-sel");
    sel=(sel+d+r.length)%r.length;
    r[sel].classList.add("is-sel");
    var el=r[sel], top=el.offsetTop, h=el.offsetHeight;
    if(top<scroll.scrollTop) scroll.scrollTop=top;
    else if(top+h>scroll.scrollTop+scroll.clientHeight) scroll.scrollTop=top+h-scroll.clientHeight;
  }

  q.addEventListener("input",function(){
    root.classList.toggle("is-typing", q.value.length>0);
    render(q.value); open();
  });
  q.addEventListener("focus",function(){ render(q.value); open(); });
  q.addEventListener("keydown",function(e){
    if(e.key==="ArrowDown"){e.preventDefault();move(1);}
    else if(e.key==="ArrowUp"){e.preventDefault();move(-1);}
    else if(e.key==="Enter"){ var r=rows(); if(sel>-1&&r[sel]){e.preventDefault();r[sel].click();} }
    else if(e.key==="Escape"){ close(); q.blur(); }
  });
  clearBtn.addEventListener("click",function(){
    q.value=""; root.classList.remove("is-typing"); render(""); q.focus();
  });
  document.addEventListener("click",function(e){
    if(!e.target.closest(".c17__searchwrap")) close();
  });
  window.addEventListener("resize",function(){ if(root.classList.contains("is-open")) fit(); });

  window.addEventListener("pageshow",function(e){ if(e.persisted) close(); });

  root.classList.add("is-ready");
})();
