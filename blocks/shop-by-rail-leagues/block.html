  tomorrow. Each instance = this file + a new block ID + its own tile data.

  ⚠️ NO IMAGE IN THIS FILE HAS BEEN SEEN TO RENDER BY AN AGENT. First deploy

  check first if a tile is dark.

/* ═══════════════════════════════════════════════════════════════════════════
   cta-canon.css — THE CTA (canon v2) · one button spec, every chassis
   ─────────────────────────────────────────────────────────────────────────
   Fills the "one CTA spec" slot from the 07-27 decision
   ("Type & CTA: dev semantic names — Body 12-20, Label 12-16, one CTA spec").
   Locked by Sacha 2026-08-02: this IS the canonical CTA.

   THIRD SIBLING stylesheet, alongside wall-canon.css and (when it lands)
   carousel-canon.css. It is NOT folded into either, because both consume it:
   the wall, the rails, the hero rails and the feature pills all need the same
   button, and duplicating it into two chassis is exactly how the old set
   drifted into 3 arrow styles and 2 zoom scales.

   Load order:  cta-canon.css  →  wall-canon.css / carousel-canon.css
   NEVER linked by any v1 block. carousel-base.css is untouched.

   SOURCE
   ─────────────────────────────────────────────────────────────────────────
   Engine : Osmo Supply "Button 009". Zero JS. Every Osmo class name, the
            data-button-009 attribute, all easings, the hover calc, the click
            scale and the focus ring are VERBATIM below.
   Design : Figma WorldSoccerShop - Site Updates, node 35:539.

   MEASURED FROM FIGMA (verified in Chromium, not eyeballed)
   ─────────────────────────────────────────────────────────────────────────
     padding       12px 16px      (symmetric; Osmo stock is asymmetric)
     gap           8px
     label         Chakra Petch 600, 14px, tracking 1.12px, UPPERCASE
     arrow         Chakra Petch 400, 22px, tracking 0.44px, glyph U+2192
     arrow advance 17px
     line box      15px      →  12 + 15 + 12 = 39px tall  ✓ matches Figma
     radius        0         (square; Osmo stock is a 2.5em pill)
     primary       #000 ground / #fff ink
     secondary     #fff ground / #000 ink / 0.75px #797474 hairline

   TWO CHANGES FROM THE OSMO SOURCE, both deliberate
   ─────────────────────────────────────────────────────────────────────────
   1. The icon <svg> elements become <span> carrying "→". Sacha's design
      specifies the Unicode arrow set in Chakra Petch, not Osmo's chevron
      vector. get_design_context returns it as TEXT, not an exported asset,
      so it is typed rather than drawn. Classes and positions unchanged.
   2. Each icon span wraps its glyph in an <i>. LOAD-BEARING, not cosmetic:
      .button-009__icon must stay at the button's 14px font-size or every em
      in Osmo's hover calc — and in `.is--left { left: var(--…-padding-right) }`
      — would resolve against 22px and the animation would break. The <i>
      carries the 22px; the span keeps the maths. Nothing removed or renamed.

   THE HOVER
   ─────────────────────────────────────────────────────────────────────────
   Rest: JERSEYS →. On hover the trailing arrow slides right and fades, the
   label slides right by (icon + gap + padding-right - padding-left) = 25px,
   and a leading arrow fades in from the left. The label lands exactly on the
   right padding edge (16 + 25 + 67 = 108 = 124 - 16), so nothing clips inside
   the overflow:clip inner. Osmo's maths, fed WSS numbers.

   CANON COMPLIANCE (07-27 locked set)
   ─────────────────────────────────────────────────────────────────────────
   · Hover is behind @media (hover:hover) and (pointer:fine) AND
     (prefers-reduced-motion: no-preference). Osmo ships it that way; no
     wrapper needed.
   · :focus-visible ring built in. See the on-dark theme below.
   · target="_top" belongs on every instance in markup (rule B1).
   · Chakra Petch must be loaded with display=swap + preconnect (rule C3).

   ⚠️ TYPE-ROLE MISMATCH, flagged not silently resolved:
      wall-canon.css sets --ws-label-14-weight: 500. Figma 35:539 specifies
      SemiBold 600 for the CTA label. Rather than mutate the shared role, the
      CTA declares its own --ws-cta-weight: 600. If the token audit decides
      Label 14 should carry a 600 variant, delete this and point at the role.
   ═══════════════════════════════════════════════════════════════════════ */

:root{
  /* ── Osmo 009 API, re-pointed at WSS values ── */
  --button-009-color:#fff;
  --button-009-color-background:#000;
  --button-009-color-focus:#000;
  --button-009-border-radius:0;
  --button-009-icon-size:1.2143em;      /* 17px — the → advance width */
  --button-009-padding-top:0.8571em;    /* 12px */
  --button-009-padding-right:1.1429em;  /* 16px */
  --button-009-padding-bottom:0.8571em; /* 12px */
  --button-009-padding-left:1.1429em;   /* 16px */
  --button-009-gap:0.5714em;            /* 8px  */
  --button-009-overflow:clip;
  --button-009-focus-inset:-0.125em;
  --button-009-click-scale:0.955 0.925;
  --button-009-ease-hover:cubic-bezier(0.32, 0.72, 0, 1);
  --button-009-ease-click:cubic-bezier(0.4, 0, 0.2, 1);
  --button-009-ease-focus:cubic-bezier(0.32, 0.72, 0, 1);

  /* ── WSS layer. --ws-font-label is shared with wall-canon.css ── */
  --ws-font-label:'Chakra Petch',Figtree,sans-serif;
  --ws-cta-size:14px;                   /* Label 14 role */
  --ws-cta-weight:600;                  /* see TYPE-ROLE MISMATCH above */
  --ws-cta-line:1.0714;                 /* 15px line box → 39px button */
  --ws-cta-line-em:1.0714em;            /* SAME 15px as a LENGTH. height: needs a length,
                                           --ws-cta-line is unitless and is invalid there. */
  --ws-cta-tracking:0.08em;             /* 1.12px */
  --ws-cta-arrow-size:1.5714em;         /* 22px */
  --ws-cta-arrow-tracking:0.02em;       /* 0.44px */
  --ws-cta-hairline:0.75px solid #797474;
}

/* ═══ OSMO BUTTON 009 — VERBATIM ═════════════════════════════════════════ */
.button-009{
  color:var(--button-009-color);
  -webkit-user-select:none;user-select:none;
  background-color:#0000;
  outline-style:none;
  padding:0;
  line-height:1;
  text-decoration:none;
  display:inline-grid;
  position:relative;
  -webkit-tap-highlight-color:transparent;
  transition:scale 0.15s var(--button-009-ease-click);
}
.button-009::after{
  content:'';display:block;position:absolute;
  inset:var(--button-009-focus-inset);
  border-radius:var(--button-009-border-radius);
  transition:box-shadow 0.3s var(--button-009-ease-focus);
  pointer-events:none;z-index:1;
}
.button-009:is(:focus-visible)::after{ box-shadow:0 0 0 0.125em var(--button-009-color-focus); }
.button-009:active{ scale:var(--button-009-click-scale); }
.button-009__inner{
  pointer-events:none;
  grid-column-gap:var(--button-009-gap);
  grid-row-gap:var(--button-009-gap);
  padding-top:var(--button-009-padding-top);
  padding-right:var(--button-009-padding-right);
  padding-bottom:var(--button-009-padding-bottom);
  padding-left:var(--button-009-padding-left);
  z-index:1;
  border-radius:var(--button-009-border-radius);
  overflow:var(--button-009-overflow);
  grid-area:1 / 1;
  justify-content:center;align-items:center;
  display:flex;position:relative;
}
.button-009__icon{
  width:var(--button-009-icon-size);
  height:var(--button-009-icon-size);
  flex:none;
  transition:translate 0.5s var(--button-009-ease-hover), opacity 0.15s ease-out;
}
.button-009__icon.is--left{
  left:var(--button-009-padding-right);
  position:absolute;
  opacity:0;
  translate:-1.5em 0 0;
}
.button-009__text{ flex:none; transition:translate 0.5s var(--button-009-ease-hover); }
.button-009__bg{
  background-color:var(--button-009-color-background);
  border-radius:var(--button-009-border-radius);
  grid-area:1 / 1;width:100%;height:100%;padding:0;
}
@media (hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference){
  .button-009:is(:hover, :focus-visible) .button-009__text,
  [data-hover]:is(:hover, :focus-visible) .button-009 .button-009__text{
    translate:calc(var(--button-009-icon-size) + var(--button-009-gap) + var(--button-009-padding-right) - var(--button-009-padding-left)) 0 0;
    transition:translate 0.5s 0.075s var(--button-009-ease-hover);
  }
  .button-009:is(:hover, :focus-visible) .button-009__icon.is--left,
  [data-hover]:is(:hover, :focus-visible) .button-009 .button-009__icon.is--left{
    translate:0 0 0;opacity:1;
    transition:translate 0.5s 0.075s var(--button-009-ease-hover), opacity 0.15s 0.075s ease-out;
  }
  .button-009:is(:hover, :focus-visible) .button-009__icon.is--right,
  [data-hover]:is(:hover, :focus-visible) .button-009 .button-009__icon.is--right{
    translate:1.5em 0 0;opacity:0;
    transition:translate 0.5s 0.05s var(--button-009-ease-hover), opacity 0.15s 0.075s ease-out;
  }
}
/* ═══ END OSMO ════════════════════════════════════════════════════════════ */


/* ── WSS skin, additive only ─────────────────────────────────────────────── */
.button-009{
  font-family:var(--ws-font-label);
  font-size:var(--ws-cta-size);
}
.button-009__text{
  font-weight:var(--ws-cta-weight);
  line-height:var(--ws-cta-line);                        /* 15px → 39px button */
  letter-spacing:var(--ws-cta-tracking);
  margin-right:calc(var(--ws-cta-tracking) * -1);        /* kill the trailing letter-space; Figma does not render it */
  text-transform:uppercase;
}
.button-009__icon{
  height:var(--ws-cta-line-em);                          /* 15px. MUST be the -em variant */
  display:flex;align-items:center;justify-content:center;
}
.button-009__icon > i{                                   /* carries the 22px so the span stays at 14px */
  font-style:normal;
  font-weight:400;
  font-size:var(--ws-cta-arrow-size);
  letter-spacing:var(--ws-cta-arrow-tracking);
  line-height:1;
  display:block;
}

/* ── THEMES (Osmo's documented data-theme pattern) ───────────────────────── */

/* secondary — outlined, for light grounds */
.button-009[data-theme='secondary']{
  --button-009-color:#000;
  --button-009-color-background:#fff;
}
.button-009[data-theme='secondary'] .button-009__bg{ border:var(--ws-cta-hairline); }

/* on-dark — for the C-13 wall (#0A0A0A) and any dark surface.
   REASON THIS EXISTS: the default focus ring is #000 and disappears completely
   against the wall's ground, so keyboard users lose the focus indicator. White
   ground reads on dark and the ring flips to white. Osmo's accessibility note
   calls this out: --button-009-color-focus must contrast with the SURROUNDING
   background, not the button.
   ⚠️ Theme name picked by Claude 2026-08-02, not by Sacha. Rename freely. */
.button-009[data-theme='on-dark']{
  --button-009-color:#0A0A0A;
  --button-009-color-background:#fff;
  --button-009-color-focus:#fff;
}

:root{

*,*::before,*::after{box-sizing:border-box}
html,body{

.sb{
  position:relative;
  width:100%;
  padding-bottom:var(--sb-pad-bottom);
  background:var(--sb-ground);
  font-family:var(--sb-label-font);
  -webkit-font-smoothing:antialiased;
}

/* ═══ RAIL ═══ */
.sb-rail{
  display:flex;
  gap:var(--sb-gap);
  padding:0 var(--sb-gutter);
  overflow-x:auto;
  overflow-y:hidden;
  scroll-snap-type:x proximity;
  scroll-padding-inline-start:var(--sb-gutter);
  scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  touch-action:pan-x pan-y;
}
.sb-rail::-webkit-scrollbar{display:none}

/* ═══ TILE ═══ */
.sb-tile{
  position:relative;
  flex:0 0 auto;
  width:var(--sb-tile-w);
  height:var(--sb-tile-h);
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:flex-start;
  padding:0 0 var(--sb-tile-pad) var(--sb-tile-pad);
  background:var(--sb-tile-ground);

  scroll-snap-align:start;
  text-decoration:none;

  -webkit-tap-highlight-color:transparent;

.sb-tile:focus-visible{outline:2px solid var(--sb-focus);outline-offset:3px}

.sb-tile__img{

.sb-tile__chip{

  background:var(--sb-chip-ground);
  color:var(--sb-chip-ink);

  font-size:var(--sb-label-size);

  --sb-title-font:'Chakra Petch',Figtree,system-ui,sans-serif;

   <div class="sb-head sb-head--center">: title centred on its own line, the

/* SHOP-BY RAIL · desktop arrows only. Inline, no CDN, never touches the parent. */
(function(){
  try{ if(window.self===window.top) document.documentElement.classList.add('is-standalone'); }catch(e){}
  var root=document.getElementById('sb'); if(!root) return;
  var rail=root.querySelector('.sb-rail'); if(!rail) return;
  var prev=root.querySelector('[data-sb="prev"]'), next=root.querySelector('[data-sb="next"]');
  function sync(){
    root.style.setProperty('--sb-rail-top',rail.offsetTop+'px'); /* 2026-09-25 arrows mid-photo */
    var over=rail.scrollWidth-rail.clientWidth>2;
    root.classList.toggle('has-overflow',over);
    if(!over) return;
    var x=rail.scrollLeft;
    if(prev) prev.disabled=x<=2;
    if(next) next.disabled=x>=(rail.scrollWidth-rail.clientWidth-2);
  }
  function step(d){
    var t=rail.querySelector('.sb-tile');
    var by=t?(t.getBoundingClientRect().width+8):Math.round(rail.clientWidth*0.8);
    rail.scrollBy({left:d*by,behavior:'smooth'});
  }
  if(prev) prev.addEventListener('click',function(){step(-1)});
  if(next) next.addEventListener('click',function(){step(1)});
  rail.addEventListener('scroll',sync,{passive:true});
  var rt; window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(sync,120)},{passive:true});
  root.classList.add('is-ready'); sync();
  if(document.fonts&&document.fonts.ready&&typeof document.fonts.ready.then==='function'){document.fonts.ready.then(sync);}
})();
</script>
<!-- WSS-CLICK-BEACON — attribution-safe click tracking (rules D2). Posts clicks to the

<script>
(function () {
  var BLOCK = "fastr_blocks_c20_shopby_rail_leagues_v1";
  document.addEventListener("click", function (e) {
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null;
    if (!a) return;
    try {
      window.parent.postMessage({
        type: "wss-block-click",
        block: BLOCK,
        label: (a.getAttribute("aria-label") || a.textContent || "").replace(/\s+/g, " ").trim().slice(0, 80),
        href: a.href
      }, "*");
    } catch (err) { /* fire-and-forget */ }
  }, true);
})();
